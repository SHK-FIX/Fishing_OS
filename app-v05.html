<title>Fishing OS v0.5</title>
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#17211f;--muted:#76827e;--line:#e1e7e3;--green:#3f8f52;--green2:#eaf4ed;--teal:#149ba2;--orange:#e99522;--blue:#3288d6;--purple:#7558d7;--red:#d95d4d;--shadow:0 10px 30px rgba(31,51,44,.08);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;-webkit-tap-highlight-color:transparent}body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%}
.topbar{position:sticky;top:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 9px) 16px 10px;background:rgba(245,247,244,.93);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(225,231,227,.8)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:13px;object-fit:cover;background:#fff;box-shadow:var(--shadow)}.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em}.title{font-size:27px;font-weight:850;line-height:1.05}.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:19px}
main{max-width:760px;margin:auto;padding:12px 16px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);margin-bottom:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 3px 10px}.section h2{font-size:21px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--green2);color:#356a41;font-size:11px;font-weight:800}.warning{background:#fff6e8;color:#785318;border-radius:14px;padding:11px 12px;font-size:13px}.notice{background:#edf6f2;color:#365e4a;border-radius:14px;padding:11px 12px;font-size:13px}
.btn{border:0;border-radius:14px;background:var(--green);color:white;font-weight:820;padding:12px 14px}.btn.secondary{background:#edf2ef;color:var(--ink)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fff0ee;color:#a43b2f}.full{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{position:relative;height:250px;border-radius:25px;overflow:hidden;background:linear-gradient(135deg,#8cb7a0,#2d5945);margin-bottom:14px}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(11,29,22,.84))}.heroText{position:absolute;z-index:2;left:18px;right:18px;bottom:17px;color:#fff}.heroText h2{font-size:27px;margin:4px 0}.heroText p{margin:4px 0;font-size:13px}.heroAction{position:absolute;z-index:3;right:12px;top:12px;border:0;border-radius:999px;background:#112b22b8;color:#fff;padding:9px 12px;font-weight:800}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{text-align:center;background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 4px}.metric b{display:block;font-size:23px}.metric small{color:var(--muted);font-size:10px}.metric{color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation}.metric:active{transform:scale(.97);background:#f4f7f5}.metric .chev{display:block;font-size:14px;line-height:10px;margin-top:3px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{border:0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px 4px;color:var(--ink)}.bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;margin:auto auto 6px}.quick small{font-size:10px;font-weight:750}
.row{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px;margin-bottom:9px}.row img{width:68px;height:68px;border-radius:13px;object-fit:cover;background:#edf1ef}.grow{flex:1;min-width:0}.row h3{font-size:16px;margin:0 0 3px}.row p{margin:2px 0;color:var(--muted);font-size:12px}.chev{color:#a2aaa6;font-size:22px}.empty{text-align:center;color:var(--muted);padding:26px 12px}.search{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:12px 13px;margin-bottom:10px}
.session{border:1px solid #bcd8c5;background:#f6fbf7}.sessionHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.sessionStatus{display:flex;gap:6px;align-items:center;font-size:12px;color:#42714e;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#48a35c}.session h2{margin:5px 0 2px}.sessionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.sessionCell{background:#fff;border-radius:14px;padding:10px;text-align:center;border:1px solid #d9e9dd}.sessionCell b{display:block}.sessionActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.map{height:440px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#dce6e1}.mapModes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:#e7ece9;border-radius:15px;margin-bottom:9px}.mapModes button{border:0;background:transparent;padding:8px;border-radius:11px;font-weight:800}.mapModes button.on{background:#fff;box-shadow:0 2px 8px #0001}.mapFooter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.tabbar{position:fixed;z-index:1200;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.tab{border:0;background:none;color:#818b87;padding:8px 2px 4px}.tab.active{color:var(--green)}.tab span{display:block;font-size:20px;height:24px}.tab small{font-size:9px;font-weight:700}
dialog{width:min(100%,760px);height:92vh;max-height:920px;border:0;border-radius:28px 28px 0 0;padding:0;margin:auto auto 0;background:var(--bg);z-index:3000}dialog::backdrop{background:#0006}.sheetHead{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:17px;background:rgba(245,247,244,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.textbtn{border:0;background:none;color:var(--green);font-weight:850}.sheetBody{padding:16px 16px 40px}.form{display:grid;gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:800;color:#58655f}.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid #d8dfdb;border-radius:14px;padding:12px}.field textarea{min-height:92px}.inline{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checkrow{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.sheetSection{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:850;color:var(--muted);margin-top:6px}.photoPreview{width:100%;max-height:220px;object-fit:cover;border-radius:16px;display:none}.pillbar{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:999px;font-size:12px}.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.moreGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.moreTile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;text-align:left}.moreTile b{display:block;margin:8px 0 3px}.moreTile span{font-size:25px}.moreTile small{color:var(--muted)}
.trash{opacity:.75}.swipeHint{font-size:11px;color:var(--muted);text-align:center;padding:4px}
@media(max-width:430px){main{padding-left:13px;padding-right:13px}.metrics{grid-template-columns:repeat(4,1fr);gap:5px}.metric b{font-size:20px}.metric small{font-size:9px}.hero{height:235px}.quick{gap:6px}.sessionGrid{grid-template-columns:repeat(3,1fr)}.map{height:420px}.inline{grid-template-columns:1fr}.moreGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand"><img src="assets/icons/icon-192.png" alt=""><div><div class="eyebrow">FISHING OS · v0.5</div><div class="title" id="pageTitle">Übersicht</div></div></div>
 <button class="iconbtn" id="quickBackup" title="Backup">⇩</button>
</header>
<main id="view"></main>
<nav class="tabbar">
 <button class="tab active" data-tab="dashboard"><span>⌂</span><small>Übersicht</small></button>
 <button class="tab" data-tab="waters"><span>◉</span><small>Gewässer</small></button>
 <button class="tab" data-tab="map"><span>⌖</span><small>Karte</small></button>
 <button class="tab" data-tab="catches"><span>◒</span><small>Fänge</small></button>
 <button class="tab" data-tab="more"><span>•••</span><small>Mehr</small></button>
</nav>
<dialog id="modal"><div class="sheetHead"><button class="textbtn" id="modalClose">Abbrechen</button><strong id="modalTitle"></strong><span style="width:70px"></span></div><div class="sheetBody" id="modalBody"></div></dialog>
<input type="file" id="importFile" accept="application/json,.fosbackup" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
'use strict';
const APP_VERSION='0.5.0-alpha1';
const DB_NAME='fishingOS-v030';
const DB_VERSION=2;
const STORES=['waters','spots','days','events','lab','settings','sessions','spotVisits','weather','species','tackle','media','changes'];
let db;
let state={tab:'dashboard',map:null,mapMode:'satellite',selectedWater:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>crypto.randomUUID(); const iso=()=>new Date().toISOString();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate=v=>v?new Date(v).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
const fmtTime=v=>v?new Date(v).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–';
const fmtDuration=(a,b=iso())=>{if(!a)return'–';let m=Math.max(0,Math.floor((new Date(b)-new Date(a))/60000));return m<60?`${m} min`:`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} h`};
const active=x=>!x.deletedAt;
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};q.onsuccess=e=>{db=e.target.result;res()};q.onerror=()=>rej(q.error)})}
function all(store){return new Promise((res,rej)=>{let q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
function get(store,id){return new Promise((res,rej)=>{let q=db.transaction(store).objectStore(store).get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function put(store,obj){if(!obj.id)obj.id=uid();return new Promise((res,rej)=>{let tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>res(obj);tx.onerror=()=>rej(tx.error)})}
async function softDelete(store,id){const o=await get(store,id);if(!o)return;o.deletedAt=iso();await put(store,o);await logChange(store,id,'deletedAt',null,o.deletedAt)}
async function restore(store,id){const o=await get(store,id);if(!o)return;const old=o.deletedAt;o.deletedAt=null;await put(store,o);await logChange(store,id,'deletedAt',old,null)}
async function logChange(entity,id,field,from,to){await put('changes',{id:uid(),entity,entityId:id,field,from,to,at:iso(),source:'manual'})}
async function snapshot(){const values=await Promise.all(STORES.map(all));return Object.fromEntries(STORES.map((s,i)=>[s,values[i]]))}
async function setting(id,fallback=null){return(await get('settings',id))?.value??fallback}
async function setSetting(id,value){await put('settings',{id,value,updatedAt:iso()})}
function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function locationNow(){return new Promise((res,rej)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),rej,{enableHighAccuracy:true,timeout:10000,maximumAge:30000}):rej(new Error('GPS nicht verfügbar')))}
async function seed(){if(!(await all('species')).length){const names=['Schwarzbarsch','Zander','Barsch','Hecht','Karpfen','Wels','Rapfen','Aal','Forelle','Döbel','Tilapia','Sonnenbarsch'];for(const [i,name] of names.entries())await put('species',{id:uid(),name,scientific:'',category:['Schwarzbarsch','Zander','Barsch','Hecht','Wels','Rapfen'].includes(name)?'Raubfisch':'',sort:i,deletedAt:null})}}
async function migrateLegacy(){const days=await all('days');for(const d of days){if(!d.timeZone)d.timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone;if(d.deletedAt===undefined)d.deletedAt=null;await put('days',d)}const events=await all('events');for(const e of events){let c=false;if(e.deletedAt===undefined){e.deletedAt=null;c=true}if(!e.timeZone){e.timeZone=Intl.DateTimeFormat().resolvedOptions().timeZone;c=true}if(c)await put('events',e)}const waters=await all('waters');for(const w of waters){if(w.deletedAt===undefined){w.deletedAt=null;await put('waters',w)}}const spots=await all('spots');for(const s of spots){if(s.deletedAt===undefined){s.deletedAt=null;await put('spots',s)}}}
async function activeDay(){return (await all('days')).filter(active).find(d=>!d.endedAt&&!d.end)}
async function activeSession(){const d=await activeDay();if(!d)return null;return (await all('sessions')).filter(active).find(s=>s.dayId===d.id&&!s.endedAt)}
async function activeVisit(){const s=await activeSession();if(!s)return null;return (await all('spotVisits')).filter(active).find(v=>v.sessionId===s.id&&!v.endedAt)}
async function currentContext(){const [d,s,v]=await Promise.all([activeDay(),activeSession(),activeVisit()]);return{day:d,session:s,visit:v,water:s?await get('waters',s.waterId):null,spot:v?await get('spots',v.spotId):null}}
async function startDay(){const waters=(await all('waters')).filter(active);if(!waters.length){showWaterForm(true);return}showModal('Angeltag starten',`<div class="form"><div class="field"><label>Erstes Gewässer</label><select id="startWater">${waters.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><button class="btn full" id="doStartDay">Angeltag starten</button></div>`);$('#doStartDay').onclick=async()=>{let d={id:uid(),startedAt:iso(),endedAt:null,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,note:'',deletedAt:null};await put('days',d);await startWaterSession($('#startWater').value,d.id);closeModal();render()}}
async function startWaterSession(waterId,dayId=null){const day=dayId?await get('days',dayId):await activeDay();if(!day)return;const cur=await activeSession();if(cur){await endVisit();cur.endedAt=iso();await put('sessions',cur)}const s={id:uid(),dayId:day.id,waterId,startedAt:iso(),endedAt:null,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,deletedAt:null};await put('sessions',s);try{const p=await locationNow();await captureWeather('sessionStart',p,s.id,null)}catch{}return s}
async function changeWater(){const d=await activeDay();if(!d)return;const ctx=await currentContext();const waters=(await all('waters')).filter(w=>active(w)&&w.id!==ctx.water?.id);if(!waters.length)return alert('Kein weiteres Gewässer vorhanden.');showModal('Gewässer wechseln',`<div class="form"><div class="notice">Der aktuelle Spot und Gewässerabschnitt werden beendet. Der Angeltag läuft weiter.</div><div class="field"><label>Nächstes Gewässer</label><select id="nextWater">${waters.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><button class="btn full" id="doWaterChange">Wechseln</button></div>`);$('#doWaterChange').onclick=async()=>{await startWaterSession($('#nextWater').value,d.id);closeModal();render()}}
async function endVisit(){const v=await activeVisit();if(v){v.endedAt=iso();await put('spotVisits',v)}return v}
async function startSpot(spotId){const s=await activeSession();if(!s)return alert('Kein aktiver Gewässerabschnitt.');await endVisit();const v={id:uid(),sessionId:s.id,spotId,startedAt:iso(),endedAt:null,deletedAt:null};await put('spotVisits',v);const spot=await get('spots',spotId);try{await captureWeather('spotStart',{lat:+spot.lat,lon:+spot.lon},s.id,v.id)}catch{}render()}
async function stopSpot(){await endVisit();render()}
async function finishDay(){const d=await activeDay();if(!d)return;await endVisit();const s=await activeSession();if(s){s.endedAt=iso();await put('sessions',s)}d.endedAt=iso();await put('days',d);render()}
async function latestWeather(sessionId){return (await all('weather')).filter(w=>active(w)&&w.sessionId===sessionId).sort((a,b)=>new Date(b.capturedAt)-new Date(a.capturedAt))[0]||null}
async function captureWeather(source,pos,sessionId,visitId){if(!pos||!Number.isFinite(+pos.lat)||!Number.isFinite(+pos.lon))throw new Error('Keine Position');const lat=+pos.lat,lon=+pos.lon;let payload={id:uid(),sessionId,visitId:visitId||null,capturedAt:iso(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,lat,lon,source,status:'unavailable',temperature:null,pressure:null,windSpeed:null,windDirection:null,cloudCover:null,deletedAt:null};try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,surface_pressure,wind_speed_10m,wind_direction_10m,cloud_cover&wind_speed_unit=kmh&timezone=auto`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Wetterdienst nicht erreichbar');const j=await r.json(),c=j.current||{};payload.temperature=c.temperature_2m??null;payload.pressure=c.surface_pressure??null;payload.windSpeed=c.wind_speed_10m??null;payload.windDirection=c.wind_direction_10m??null;payload.cloudCover=c.cloud_cover??null;payload.status='live'}catch(e){payload.status='offline'}await put('weather',payload);return payload}
async function manualWeatherRefresh(){const ctx=await currentContext();if(!ctx.session)return alert('Kein laufender Angeltag.');let p;if(ctx.spot&&ctx.spot.lat&&ctx.spot.lon)p={lat:+ctx.spot.lat,lon:+ctx.spot.lon};else try{p=await locationNow()}catch{return alert('Keine Position verfügbar.')}await captureWeather('manualRefresh',p,ctx.session.id,ctx.visit?.id||null);render()}
function waterOptions(waters,selected=''){return waters.map(w=>`<option value="${w.id}" ${w.id===selected?'selected':''}>${esc(w.name)}</option>`).join('')}
async function minimalSpotForContext(session){let p=null;try{p=await locationNow()}catch{}const spots=(await all('spots')).filter(s=>active(s)&&s.waterId===session.waterId);const n=Math.max(0,...spots.map(s=>+(String(s.autoNo||s.name||'').match(/\d+/)?.[0]||0)))+1;const spot={id:uid(),waterId:session.waterId,name:`Spot ${n}`,autoNo:n,lat:p?.lat??'',lon:p?.lon??'',accuracy:p?.accuracy??null,createdAt:iso(),minimal:true,deletedAt:null};await put('spots',spot);await startSpot(spot.id);return spot}
const EVENT_LABEL={catch:'Fang',bite:'Biss',lostInFight:'Im Drill verloren',follower:'Nachläufer',observation:'Beobachtung',lureLoss:'Köderverlust'};
const EVENT_ICON={catch:'🎣',bite:'⚡',lostInFight:'〽︎',follower:'🐟',observation:'◉',lureLoss:'✕'};
async function quickEvent(type){let ctx=await currentContext();if(!ctx.day||!ctx.session)return alert('Starte zuerst einen Angeltag.');if(!ctx.spot){showModal(EVENT_LABEL[type],`<div class="form"><div class="warning">Aktuell ist kein Spot aktiv.</div><button class="btn full" id="makeSpotAndEvent">Spot hier anlegen & weiter</button><button class="btn secondary full" id="cancelSpotEvent">Abbrechen</button></div>`);$('#makeSpotAndEvent').onclick=async()=>{await minimalSpotForContext(ctx.session);closeModal();quickEvent(type)};$('#cancelSpotEvent').onclick=closeModal;return}ctx=await currentContext();const species=(await all('species')).filter(active).sort((a,b)=>(a.sort??99)-(b.sort??99));const weather=await latestWeather(ctx.session.id);showModal(EVENT_LABEL[type],`<form class="form" id="eventForm"><div class="notice">${esc(ctx.water?.name||'')} · ${esc(ctx.spot?.name||'')} · ${weather?.status==='live'?`Wetter ${weather.temperature??'–'} °C`:'Wetter nicht aktuell'}</div><button type="button" class="btn secondary full" id="refreshInEvent">↻ Wetter aktualisieren</button>${type==='catch'?`<div class="field"><label>Fischart · optional</label><select name="speciesId"><option value="">Nicht eingetragen</option>${species.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="inline"><div class="field"><label>Länge cm · optional</label><input name="lengthCm" type="number" inputmode="decimal" step="0.1"></div><div class="field"><label>Gewicht lbs · optional</label><input name="weightLbs" type="number" inputmode="decimal" step="0.01"></div></div>`:''}<div class="field"><label>Köder / Setup · optional</label><input name="lureText" placeholder="Später ergänzen möglich"></div>${type==='observation'?`<div class="field"><label>Kategorie · optional</label><select name="observationCategory"><option value="">–</option><option>Fischaktivität</option><option>Beute / Nahrungsangebot</option><option>Wasser</option><option>Struktur & Vegetation</option><option>Tierwelt</option><option>Angeldruck / Störung</option><option>Wetteränderung</option><option>Sonstiges</option></select></div>`:''}<div class="field"><label>Notiz · optional</label><textarea name="note"></textarea></div><div class="field"><label>Foto · optional</label><input name="photo" type="file" accept="image/*" capture="environment"><img class="photoPreview" id="eventPhotoPreview"></div><button class="btn full">Speichern & weiterangeln</button></form>`);$('#refreshInEvent').onclick=manualWeatherRefresh;const pf=$('#eventForm input[name=photo]');pf.onchange=()=>{if(pf.files[0]){const u=URL.createObjectURL(pf.files[0]);$('#eventPhotoPreview').src=u;$('#eventPhotoPreview').style.display='block'}};$('#eventForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);const current=await currentContext();const w=await latestWeather(current.session.id);let photoData='';const f=pf.files[0];if(f)photoData=await fileToDataURL(f);const ev={id:uid(),type,dayId:current.day.id,sessionId:current.session.id,spotVisitId:current.visit?.id||null,spotId:current.spot?.id||null,waterId:current.water?.id||null,occurredAt:iso(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,weatherId:w?.id||null,speciesId:fd.get('speciesId')||'',lengthCm:num(fd.get('lengthCm')),weightLbs:num(fd.get('weightLbs')),lureText:fd.get('lureText')||'',observationCategory:fd.get('observationCategory')||'',note:fd.get('note')||'',photo:photoData,deletedAt:null,historical:false};await put('events',ev);closeModal();render()}}
const num=x=>x===''||x===null?null:+x;
function fileToDataURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function showWaterForm(startAfter=false,existing=null){showModal(existing?'Gewässer bearbeiten':'Gewässer hinzufügen',`<form class="form" id="waterForm"><div class="field"><label>Name</label><input name="name" required value="${esc(existing?.name||'')}"></div><div class="field"><label>Region / Land · optional</label><input name="region" value="${esc(existing?.region||'')}"></div><div class="inline"><div class="field"><label>Breitengrad · optional</label><input name="lat" inputmode="decimal" value="${esc(existing?.lat||'')}"></div><div class="field"><label>Längengrad · optional</label><input name="lon" inputmode="decimal" value="${esc(existing?.lon||'')}"></div></div><button type="button" class="btn secondary full" id="waterGPS">Aktuelle Position übernehmen</button><div class="field"><label>Notiz · optional</label><textarea name="note">${esc(existing?.note||'')}</textarea></div><button class="btn full">Speichern</button></form>`);$('#waterGPS').onclick=async()=>{try{let p=await locationNow();$('#waterForm [name=lat]').value=p.lat;$('#waterForm [name=lon]').value=p.lon}catch{alert('GPS konnte nicht gelesen werden.')}};$('#waterForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.currentTarget);const w={...(existing||{}),id:existing?.id||uid(),name:fd.get('name'),region:fd.get('region'),lat:fd.get('lat'),lon:fd.get('lon'),note:fd.get('note'),createdAt:existing?.createdAt||iso(),deletedAt:null};await put('waters',w);closeModal();if(startAfter){const d={id:uid(),startedAt:iso(),endedAt:null,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,note:'',deletedAt:null};await put('days',d);await startWaterSession(w.id,d.id)}render()}}

async function renderDashboard(){const [waters,spots,events,days]=await Promise.all(['waters','spots','events','days'].map(all));const wa=waters.filter(active),sp=spots.filter(active),ev=events.filter(active),da=days.filter(active);const catches=ev.filter(e=>e.type==='catch');const ctx=await currentContext();let hero=await setting('dashboardHero','');let html=`${hero?`<div class="hero"><img src="${hero}"><button class="heroAction" id="heroEdit">Foto ändern</button><div class="heroText"><div class="eyebrow" style="color:#dbece2">DEINE ANGEL-DATENBANK</div><h2>Fishing OS</h2><p>${catches.length} Fänge · ${wa.length} Gewässer · ${sp.length} Spots</p></div></div>`:`<div class="card"><div class="section" style="margin:0"><h2>Deine Angel-Datenbank</h2><button class="btn secondary" id="heroEdit">Titelbild</button></div><p class="muted">Privat, offline-first und vollständig nachbearbeitbar.</p></div>`}<div class="metrics"><button class="metric" type="button" data-dashboard-nav="catches"><b>${catches.length}</b><small>Fänge</small><span class="chev">›</span></button><button class="metric" type="button" data-dashboard-nav="waters"><b>${wa.length}</b><small>Gewässer</small><span class="chev">›</span></button><button class="metric" type="button" data-dashboard-nav="spots"><b>${sp.length}</b><small>Spots</small><span class="chev">›</span></button><button class="metric" type="button" data-dashboard-nav="journal"><b>${da.length}</b><small>Angeltage</small><span class="chev">›</span></button></div>`;
if(ctx.day){const w=await latestWeather(ctx.session?.id);html+=`<div class="section"><h2>Aktiver Angeltag</h2><span class="badge">läuft</span></div><div class="card session"><div class="sessionHead"><div><div class="sessionStatus"><span class="dot"></span>Angeltag aktiv</div><h2>${esc(ctx.water?.name||'Gewässer wählen')}</h2><div class="muted">${ctx.spot?esc(ctx.spot.name):'Unterwegs · kein Spot aktiv'}</div></div><b>${fmtDuration(ctx.day.startedAt)}</b></div><div class="sessionGrid"><div class="sessionCell"><small>Start</small><b>${fmtTime(ctx.day.startedAt)}</b></div><div class="sessionCell"><small>Spot</small><b>${ctx.visit?fmtDuration(ctx.visit.startedAt):'–'}</b></div><div class="sessionCell"><small>Wetter</small><b>${w?.temperature!=null?Math.round(w.temperature)+'°':'–'}</b></div></div><div class="sessionActions"><button class="btn secondary" id="spotAction">${ctx.spot?'Spot beenden':'Spot starten'}</button><button class="btn secondary" id="waterChange">Gewässer wechseln</button></div><button class="btn danger full" id="dayFinish" style="margin-top:8px">Angeltag beenden</button></div><div class="section"><h2>Schnelleinträge</h2><button class="textbtn" id="manualWeather">Wetter ↻</button></div><div class="quick">${['catch','bite','lostInFight','follower','observation','lureLoss'].map((t,i)=>`<button data-event="${t}"><div class="bubble" style="background:${['#3f8f52','#e99522','#d95d4d','#3288d6','#7558d7','#68736e'][i]}">${EVENT_ICON[t]}</div><small>${EVENT_LABEL[t]}</small></button>`).join('')}</div>`}else html+=`<div class="section"><h2>Angeltag</h2></div><div class="card"><h2 style="margin-top:0">Bereit fürs Wasser?</h2><p class="muted">Starten → Gewässer wählen → Spot starten → angeln.</p><button class="btn full" id="dayStart">Angeltag starten</button></div>`;

function chooseHero(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){const d=await fileToDataURL(i.files[0]);await setSetting('dashboardHero',d);render()}};i.click()}

async function renderCatches(){const [events,waters,spots,species]=await Promise.all(['events','waters','spots','species'].map(all));const catches=events.filter(e=>active(e)&&e.type==='catch').sort((a,b)=>new Date(b.occurredAt||0)-new Date(a.occurredAt||0));$('#view').innerHTML=`<input class="search" id="catchSearch" placeholder="Fänge durchsuchen"><div class="pillbar"><button class="pill on">Alle</button><button class="pill">Neueste</button><button class="pill">Größte</button><button class="pill">Mit Foto</button></div><div class="section"><h2>${catches.length} Fänge</h2><button class="textbtn" id="historicalCatch">＋ Historisch</button></div><div id="catchList">${catches.map(e=>catchCard(e,waters,spots,species)).join('')||'<div class="empty">Noch keine Fänge.</div>'}</div>`;$('#catchSearch').oninput=e=>$$('[data-catch]').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');$('#historicalCatch').onclick=historicalCatch;$$('[data-catch]').forEach(b=>b.onclick=()=>showEventDetail(b.dataset.catch))}
function catchCard(e,waters,spots,species){const w=waters.find(x=>x.id===(e.waterId||e.water)),s=spots.find(x=>x.id===(e.spotId||e.spot)),sp=species.find(x=>x.id===e.speciesId);return `<button class="row" data-catch="${e.id}">${e.photo?`<img src="${e.photo}">`:`<div style="width:68px;height:68px;border-radius:14px;background:#edf2ef;display:grid;place-items:center;font-size:27px">🎣</div>`}<div class="grow"><h3>${esc(sp?.name||e.species||'Fang')}</h3><p>${e.lengthCm?e.lengthCm+' cm':''}${e.lengthCm&&e.weightLbs?' · ':''}${e.weightLbs?e.weightLbs+' lbs':''}</p><p>${esc(w?.name||'')} ${s?'· '+esc(s.name):''}</p><p>${fmtDate(e.occurredAt||e.at)} · ${fmtTime(e.occurredAt||e.at)}</p></div><span class="chev">›</span></button>`}
async function historicalCatch(){const waters=(await all('waters')).filter(active),species=(await all('species')).filter(active);if(!waters.length)return showWaterForm();showModal('Vergangenen Fang hinzufügen',`<form class="form" id="histForm"><div class="field"><label>Datum</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Uhrzeit · optional</label><input name="time" type="time"></div><div class="field"><label>Gewässer</label><select name="waterId">${waterOptions(waters)}</select></div><div class="field"><label>Standortgenauigkeit</label><select name="locationAccuracy"><option>Nur Gewässer bekannt</option><option>Ungefährer Bereich bekannt</option><option>Exakter Spot bekannt</option><option>Ort unbekannt</option></select></div><div class="field"><label>Fischart · optional</label><select name="speciesId"><option value="">–</option>${species.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="inline"><div class="field"><label>Länge cm</label><input name="lengthCm" type="number" step="0.1"></div><div class="field"><label>Gewicht lbs</label><input name="weightLbs" type="number" step="0.01"></div></div><div class="field"><label>Notiz</label><textarea name="note"></textarea></div><div class="field"><label>Foto</label><input name="photo" type="file" accept="image/*"></div><button class="btn full">Historischen Fang speichern</button></form>`);$('#histForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),ds=fd.get('date'),ts=fd.get('time')||'12:00',occurredAt=new Date(`${ds}T${ts}:00`).toISOString();let photo='';const f=e.currentTarget.photo.files[0];if(f)photo=await fileToDataURL(f);await put('events',{id:uid(),type:'catch',dayId:null,sessionId:null,spotVisitId:null,spotId:null,waterId:fd.get('waterId'),occurredAt,timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,weatherId:null,speciesId:fd.get('speciesId'),lengthCm:num(fd.get('lengthCm')),weightLbs:num(fd.get('weightLbs')),locationAccuracy:fd.get('locationAccuracy'),note:fd.get('note'),photo,historical:true,deletedAt:null});closeModal();render()}}
async function showEventDetail(id){const e=await get('events',id);if(!e)return;const [w,s,sp,wea]=await Promise.all([e.waterId?get('waters',e.waterId):null,e.spotId?get('spots',e.spotId):null,e.speciesId?get('species',e.speciesId):null,e.weatherId?get('weather',e.weatherId):null]);showModal(EVENT_LABEL[e.type]||'Ereignis',`${e.photo?`<img src="${e.photo}" style="width:100%;max-height:280px;object-fit:cover;border-radius:20px;margin-bottom:12px">`:''}<div class="card"><h2 style="margin-top:0">${esc(sp?.name||EVENT_LABEL[e.type]||'Ereignis')}</h2><p>${esc(w?.name||'')} ${s?'· '+esc(s.name):''}</p><p>${fmtDate(e.occurredAt)} · ${fmtTime(e.occurredAt)} ${e.historical?'<span class="badge">nachgetragen</span>':''}</p>${e.lengthCm?`<p><b>Länge:</b> ${e.lengthCm} cm</p>`:''}${e.weightLbs?`<p><b>Gewicht:</b> ${e.weightLbs} lbs <span class="muted">(${(e.weightLbs*0.45359237).toFixed(2)} kg)</span></p>`:''}${e.lureText?`<p><b>Köder:</b> ${esc(e.lureText)}</p>`:''}${wea?.status==='live'?`<p><b>Wetter:</b> ${wea.temperature??'–'} °C · ${wea.pressure??'–'} hPa</p>`:''}${e.note?`<p>${esc(e.note)}</p>`:''}</div><button class="btn danger full" id="eventTrash">In Papierkorb</button>`);$('#eventTrash').onclick=async()=>{if(confirm('Ereignis in den Papierkorb verschieben?')){await softDelete('events',e.id);closeModal();render()}}}
async function renderMap(){const [waters,spots]=await Promise.all([all('waters'),all('spots')]);$('#view').innerHTML=`<div class="mapModes"><button data-mode="satellite" class="${state.mapMode==='satellite'?'on':''}">Satellit</button><button data-mode="hybrid" class="${state.mapMode==='hybrid'?'on':''}">Hybrid</button><button data-mode="map" class="${state.mapMode==='map'?'on':''}">Karte</button></div><div id="map" class="map"></div><div class="mapFooter"><button class="btn secondary" id="myLocation">⌖ Mein Standort</button><button class="btn" id="mapAddSpot">＋ Spot hier</button></div><p class="small muted">Gespeicherte Spots funktionieren offline. Kartenbilder selbst hängen vom verfügbaren Karten-Cache / Netz ab.</p>`;setTimeout(()=>initMap(waters.filter(active),spots.filter(active)),0);$$('[data-mode]').forEach(b=>b.onclick=()=>{state.mapMode=b.dataset.mode;renderMap()});$('#mapAddSpot').onclick=async()=>{const ctx=await currentContext();if(ctx.session)return showSpotForm(ctx.session.waterId);const wa=waters.filter(active);if(!wa.length)return showWaterForm();showModal('Gewässer wählen',`<div class="form">${wa.map(w=>`<button class="row" data-map-water="${w.id}"><div class="grow"><h3>${esc(w.name)}</h3></div><span class="chev">›</span></button>`).join('')}</div>`);$$('[data-map-water]').forEach(b=>b.onclick=()=>{closeModal();showSpotForm(b.dataset.mapWater)})}}
function initMap(waters,spots){if(state.map){state.map.remove();state.map=null}const el=$('#map');if(!el||!window.L)return;state.map=L.map(el,{zoomControl:false}).setView([28.1,-15.6],10);let layer;if(state.mapMode==='map')layer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});else layer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});layer.addTo(state.map);spots.filter(s=>Number.isFinite(+s.lat)&&Number.isFinite(+s.lon)).forEach(s=>L.marker([+s.lat,+s.lon]).addTo(state.map).bindPopup(`<b>${esc(s.name)}</b><br>${esc(waters.find(w=>w.id===s.waterId)?.name||'')}`));const pts=spots.filter(s=>Number.isFinite(+s.lat)&&Number.isFinite(+s.lon)).map(s=>[+s.lat,+s.lon]);if(pts.length)state.map.fitBounds(pts,{padding:[30,30],maxZoom:15});$('#myLocation').onclick=async()=>{try{let p=await locationNow();state.map.setView([p.lat,p.lon],16);L.circle([p.lat,p.lon],{radius:p.accuracy||20}).addTo(state.map)}catch{alert('Standort nicht verfügbar.')}}}
async function renderMore(){const events=(await all('events')).filter(active),days=(await all('days')).filter(active),species=(await all('species')).filter(active),tackle=(await all('tackle')).filter(active);$('#view').innerHTML=`<div class="moreGrid"><button class="moreTile" data-more="journal"><span>▤</span><b>Tagebuch</b><small>${days.length} Angeltage</small></button><button class="moreTile" data-more="stats"><span>▥</span><b>Statistik & Analyse</b><small>${events.length} Ereignisse</small></button><button class="moreTile" data-more="tackle"><span>⌁</span><b>Tackle</b><small>${tackle.length} Einträge</small></button><button class="moreTile" data-more="species"><span>🐟</span><b>Fischarten</b><small>${species.length} Arten</small></button><button class="moreTile" data-more="trash"><span>⌫</span><b>Papierkorb</b><small>Wiederherstellen</small></button><button class="moreTile" data-more="settings"><span>⚙︎</span><b>Einstellungen</b><small>Daten & Backup</small></button></div>`;$$('[data-more]').forEach(b=>b.onclick=()=>renderSubpage(b.dataset.more))}
async function renderSubpage(which){if(which==='journal')return renderJournal();if(which==='stats')return renderStats();if(which==='species')return renderSpecies();if(which==='tackle')return renderTackle();if(which==='trash')return renderTrash();if(which==='settings')return renderSettings()}
async function renderJournal(){const [days,sessions,waters,events]=await Promise.all(['days','sessions','waters','events'].map(all));$('#pageTitle').textContent='Tagebuch';const ds=days.filter(active).sort((a,b)=>new Date(b.startedAt||b.start||0)-new Date(a.startedAt||a.start||0));$('#view').innerHTML=`${ds.map(d=>{const ss=sessions.filter(s=>active(s)&&s.dayId===d.id),names=ss.map(s=>waters.find(w=>w.id===s.waterId)?.name).filter(Boolean),ev=events.filter(e=>active(e)&&e.dayId===d.id);return `<div class="card"><div class="section" style="margin:0"><div><h2 style="margin:0">${fmtDate(d.startedAt||d.start)}</h2><div class="muted">${names.join(' → ')||'Historischer Angeltag'}</div></div><span class="badge">${ev.filter(e=>e.type==='catch').length} Fänge</span></div><p>${fmtTime(d.startedAt||d.start)} – ${d.endedAt?fmtTime(d.endedAt):'läuft'} · ${fmtDuration(d.startedAt||d.start,d.endedAt||iso())}</p></div>`}).join('')||'<div class="empty">Noch keine Angeltage.</div>'}`}
async function renderStats(){const [events,days,waters,spots]=await Promise.all(['events','days','waters','spots'].map(all));const ev=events.filter(active),c=ev.filter(e=>e.type==='catch'),b=ev.filter(e=>e.type==='bite'),l=ev.filter(e=>e.type==='lostInFight'),f=ev.filter(e=>e.type==='follower');let mins=0;days.filter(active).forEach(d=>{if(d.startedAt||d.start)mins+=Math.max(0,(new Date(d.endedAt||iso())-new Date(d.startedAt||d.start))/60000)});$('#pageTitle').textContent='Statistik';$('#view').innerHTML=`<div class="metrics"><div class="metric"><b>${c.length}</b><small>Fänge</small></div><div class="metric"><b>${b.length}</b><small>Bisse</small></div><div class="metric"><b>${l.length}</b><small>Drill verloren</small></div><div class="metric"><b>${f.length}</b><small>Nachläufer</small></div></div><div class="section"><h2>Datengrundlage</h2></div><div class="card"><p><b>Angelzeit:</b> ${(mins/60).toFixed(1)} h</p><p><b>Fänge / Angelstunde:</b> ${mins?((c.length/(mins/60))).toFixed(2):'–'}</p><p><b>Landungsquote:</b> ${(c.length+l.length)?Math.round(c.length/(c.length+l.length)*100)+' %':'–'}</p><div class="notice">Fishing OS zeigt Zusammenhänge, aber behauptet keine Ursachen. Bei kleinen Stichproben bleibt die Bewertung bewusst vorsichtig.</div></div>`}
async function renderSpecies(){const sp=(await all('species')).filter(active).sort((a,b)=>(a.sort??99)-(b.sort??99));$('#pageTitle').textContent='Fischarten';$('#view').innerHTML=`<button class="btn full" id="newSpecies">＋ Eigene Fischart</button><div class="section"><h2>Bibliothek</h2></div>${sp.map(s=>`<button class="row" data-species="${s.id}"><div style="width:52px;height:52px;border-radius:14px;background:#edf2ef;display:grid;place-items:center;font-size:25px">🐟</div><div class="grow"><h3>${esc(s.name)}</h3><p>${esc(s.category||'')}</p></div><span class="chev">›</span></button>`).join('')}`;$('#newSpecies').onclick=()=>speciesForm();$$('[data-species]').forEach(b=>b.onclick=async()=>speciesForm(await get('species',b.dataset.species)))}
function speciesForm(existing=null){showModal(existing?'Fischart bearbeiten':'Fischart hinzufügen',`<form class="form" id="speciesForm"><div class="field"><label>Name</label><input name="name" required value="${esc(existing?.name||'')}"></div><div class="field"><label>Wissenschaftlicher Name · optional</label><input name="scientific" value="${esc(existing?.scientific||'')}"></div><div class="field"><label>Typ · optional</label><select name="category"><option value="">–</option><option ${existing?.category==='Raubfisch'?'selected':''}>Raubfisch</option><option ${existing?.category==='Friedfisch'?'selected':''}>Friedfisch</option><option ${existing?.category==='Sonstiges'?'selected':''}>Sonstiges</option></select></div><div class="field"><label>Eigene Notiz</label><textarea name="note">${esc(existing?.note||'')}</textarea></div><button class="btn full">Speichern</button></form>`);$('#speciesForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.currentTarget);await put('species',{...(existing||{}),id:existing?.id||uid(),name:fd.get('name'),scientific:fd.get('scientific'),category:fd.get('category'),note:fd.get('note'),sort:existing?.sort??99,deletedAt:null});closeModal();renderSpecies()}}
async function renderTackle(){const t=(await all('tackle')).filter(active);$('#pageTitle').textContent='Tackle';$('#view').innerHTML=`<button class="btn full" id="newTackle">＋ Tackle hinzufügen</button><div class="section"><h2>Deine Ausrüstung</h2></div>${t.map(x=>`<button class="row" data-tackle="${x.id}"><div style="width:52px;height:52px;border-radius:14px;background:#edf2ef;display:grid;place-items:center;font-size:23px">⌁</div><div class="grow"><h3>${esc(x.name)}</h3><p>${esc(x.kind||'')}</p></div><span class="chev">›</span></button>`).join('')||'<div class="empty">Noch kein Tackle eingetragen.</div>'}`;$('#newTackle').onclick=()=>tackleForm();$$('[data-tackle]').forEach(b=>b.onclick=async()=>tackleForm(await get('tackle',b.dataset.tackle)))}
function tackleForm(existing=null){showModal(existing?'Tackle bearbeiten':'Tackle hinzufügen',`<form class="form" id="tackleForm"><div class="field"><label>Typ</label><select name="kind"><option>Köder</option><option>Rute · Baitcast</option><option>Rute · Stationär</option><option>Rolle · Baitcast</option><option>Rolle · Stationär</option><option>Hauptschnur</option><option>Vorfach</option><option>Haken</option><option>Gewicht / Beschwerung</option><option>Snap</option><option>Wirbel</option><option>Rig</option><option>Setup</option><option>Zubehör</option></select></div><div class="field"><label>Name</label><input name="name" required value="${esc(existing?.name||'')}"></div><div class="field"><label>Hersteller / Modell · optional</label><input name="model" value="${esc(existing?.model||'')}"></div><div class="field"><label>Notiz</label><textarea name="note">${esc(existing?.note||'')}</textarea></div><button class="btn full">Speichern</button></form>`);if(existing)$('#tackleForm [name=kind]').value=existing.kind;$('#tackleForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.currentTarget);await put('tackle',{...(existing||{}),id:existing?.id||uid(),kind:fd.get('kind'),name:fd.get('name'),model:fd.get('model'),note:fd.get('note'),deletedAt:null});closeModal();renderTackle()}}
async function renderTrash(){const groups=['waters','spots','days','events','species','tackle'];let rows=[];for(const g of groups)for(const x of(await all(g)).filter(x=>x.deletedAt))rows.push({store:g,obj:x});$('#pageTitle').textContent='Papierkorb';$('#view').innerHTML=`<div class="notice">Nichts wird automatisch endgültig gelöscht.</div><div class="section"><h2>${rows.length} Elemente</h2></div>${rows.map(({store,obj})=>`<div class="row trash"><div class="grow"><h3>${esc(obj.name||EVENT_LABEL[obj.type]||store)}</h3><p>${esc(store)} · gelöscht ${fmtDate(obj.deletedAt)}</p></div><button class="btn secondary" data-restore="${store}:${obj.id}">Wiederherstellen</button></div>`).join('')||'<div class="empty">Papierkorb ist leer.</div>'}`;$$('[data-restore]').forEach(b=>b.onclick=async()=>{let[s,id]=b.dataset.restore.split(':');await restore(s,id);renderTrash()})}
async function renderSettings(){const last=await setting('lastBackupAt','Noch nie');$('#pageTitle').textContent='Einstellungen';$('#view').innerHTML=`<div class="card"><h2 style="margin-top:0">Daten & Backup</h2><p class="muted">Letztes Backup: ${typeof last==='string'&&last.includes('T')?fmtDate(last)+' '+fmtTime(last):esc(last)}</p><div class="two"><button class="btn" id="exportBtn">Backup erstellen</button><button class="btn secondary" id="importBtn">Backup importieren</button></div></div><div class="card"><h2 style="margin-top:0">Einheiten</h2><div class="field"><label>Gewicht</label><select id="weightUnit"><option>lbs</option><option>kg</option><option>g</option></select></div><div class="field" style="margin-top:10px"><label>Länge</label><select id="lengthUnit"><option>cm</option><option>inch</option></select></div></div><div class="card"><h2 style="margin-top:0">Fishing OS</h2><p>Version ${APP_VERSION}</p><p class="muted">PWA-first · offline-first · private Spots.</p></div>`;$('#weightUnit').value=await setting('weightUnit','lbs');$('#lengthUnit').value=await setting('lengthUnit','cm');$('#weightUnit').onchange=e=>setSetting('weightUnit',e.target.value);$('#lengthUnit').onchange=e=>setSetting('lengthUnit',e.target.value);$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#importFile').click()}
async function exportBackup(){const d=await snapshot();const pack={format:'FishingOSBackup',backupFormatVersion:1,schemaVersion:5,appVersion:APP_VERSION,createdAt:iso(),backupId:uid(),data:d};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FishingOS-Backup-${new Date().toISOString().slice(0,10)}.fosbackup`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);await setSetting('lastBackupAt',iso())}
async function importBackupFile(file){let pack;try{pack=JSON.parse(await file.text())}catch{return alert('Datei konnte nicht gelesen werden.')}const source=pack.data||pack;if(!source||!source.waters)return alert('Kein gültiges Fishing-OS-Backup.');if(!confirm('Import ergänzt vorhandene Daten. Gleiche IDs werden aktualisiert. Fortfahren?'))return;await exportSafetyBackup();for(const store of STORES){if(!Array.isArray(source[store]))continue;for(const obj of source[store])await put(store,obj)}alert('Import abgeschlossen.');render()}
async function exportSafetyBackup(){const d=await snapshot();await setSetting('safetyBackup',{createdAt:iso(),data:d})}
async function bindEventRows(){$$('[data-open-event]').forEach(b=>b.onclick=()=>showEventDetail(b.dataset.openEvent))}
async function render(){const titles={dashboard:'Übersicht',waters:'Gewässer',map:'Karte',catches:'Fänge',more:'Mehr'};$('#pageTitle').textContent=titles[state.tab]||'Fishing OS';$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(state.tab==='dashboard')await renderDashboard();if(state.tab==='waters')await renderWaters();if(state.tab==='map')await renderMap();if(state.tab==='catches')await renderCatches();if(state.tab==='more')await renderMore();bindEventRows()}
function switchTab(t){state.tab=t;if(state.map&&t!=='map'){state.map.remove();state.map=null}render()}
$$('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#modalClose').onclick=closeModal;$('#quickBackup').onclick=exportBackup;$('#importFile').onchange=e=>{if(e.target.files[0])importBackupFile(e.target.files[0]);e.target.value=''};
(async()=>{await openDB();await migrateLegacy();await seed();await render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})();
</script>
