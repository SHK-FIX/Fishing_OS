*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:96px}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:10px 17px 32px}.topbar{position:sticky;top:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 10px) 18px 12px;background:rgba(246,248,245,.94);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brandmark{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}.brandmark img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:12px;color:var(--muted);font-weight:800}h1{font-size:30px;line-height:1;margin:2px 0 0}.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero{height:300px;position:relative;overflow:hidden;padding:0;background:linear-gradient(135deg,#adc9ca,#31524a)}.hero>img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 18%,rgba(4,21,18,.86))}.heroText{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}.heroText h2{font-size:28px;margin:4px 0}.heroEdit{position:absolute;z-index:3;top:14px;left:14px;border:0;border-radius:999px;background:rgba(18,31,28,.72);color:#fff;padding:9px 12px;font-weight:800;backdrop-filter:blur(8px)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #ffffff55;background:#162b2788;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 4px 11px}.section h2{margin:0;font-size:22px}.link{border:0;background:none;color:var(--green);font-weight:850}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px 3px;text-align:center;box-shadow:0 4px 14px #00000008}.metric b{display:block;font-size:24px;margin:3px}.metric small,.muted{color:var(--muted)}.weatherGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weatherCell{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:center}.weatherCell b{display:block;font-size:17px}.weatherCell small{color:var(--muted)}.btn{border:0;border-radius:14px;padding:13px 15px;background:var(--teal);color:#fff;font-weight:850}.btn.secondary{background:#edf3f0;color:var(--ink)}.btn.danger{background:#fff0ee;color:#b33627}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.full{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{border:0;background:none}.bubble{width:52px;height:52px;margin:auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:25px}.quick small{display:block;margin-top:6px}.row{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:9px;text-align:left;width:100%}.row img{width:70px;height:70px;object-fit:cover;border-radius:14px}.grow{flex:1}.row h3{margin:0 0 4px}.memory{border-left:4px solid var(--orange)}.lab{border-left:4px solid var(--purple)}.lost{border-left:4px solid var(--red)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf3f0;font-size:11px;font-weight:800}.map{height:445px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#dce8e4}.mapNote{font-size:12px;color:var(--muted);margin:8px 3px}.mapActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mapModes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;border-radius:15px;background:#e9efec;margin-bottom:10px}.mapModes button{border:0;background:none;padding:9px;border-radius:11px;font-weight:750}.mapModes button.on{background:#fff;box-shadow:0 2px 8px #0001}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px}.stat b{font-size:28px}.statline{display:flex;justify-content:space-between;gap:10px;align-items:center}.notice{padding:12px 14px;border-radius:15px;background:#eef6f5;color:#31514a;font-size:13px}.warning{padding:12px 14px;border-radius:15px;background:#fff6e8;color:#6d4b16;font-size:13px}.empty{text-align:center;padding:26px;color:var(--muted)}.waterHero{height:270px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,#adc9ca,#31524a);margin-bottom:10px}.waterHero img{width:100%;height:100%;object-fit:cover}.waterHero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(4,21,18,.82))}.waterHeroText{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;color:#fff}.waterHeroText h2{font-size:28px;margin:4px 0}.waterHeroActions{position:absolute;z-index:3;top:13px;right:13px;display:flex;gap:8px}.waterHeroActions button{border:0;border-radius:999px;background:#162b27aa;color:#fff;padding:9px 11px;font-weight:800}.profileGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.profileMetric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:11px 6px;text-align:center}.profileMetric b{display:block;font-size:22px}.kv{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}.spotStrip{display:flex;gap:9px;overflow:auto;padding-bottom:3px}.spotMini{min-width:180px;border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden;text-align:left}.spotMini img{width:100%;height:88px;object-fit:cover}.spotMini div{padding:10px}.spotMini b{display:block}.timeline .row{box-shadow:none}.sessionPill{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#eef6f5;border-radius:14px;margin-top:10px}.sessionPill b{margin-left:auto}.tabbar{position:fixed;z-index:1200;bottom:0;left:0;right:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 82px 1fr 1fr;align-items:center}.tab{border:0;background:none;color:#7e8985}.tab.active{color:var(--teal)}.tab span{display:block;font-size:21px}.tab small{font-size:10px}.fab{width:62px;height:62px;border-radius:50%;border:6px solid var(--bg);background:var(--teal);color:#fff;font-size:34px;transform:translateY(-15px);box-shadow:var(--shadow)}dialog{width:min(100%,760px);height:90vh;max-height:900px;border:0;border-radius:27px 27px 0 0;padding:0;margin:auto auto 0;background:var(--bg);z-index:2000}dialog::backdrop{background:#0006}.sheetHead{position:sticky;top:0;z-index:3;padding:17px;background:rgba(246,248,245,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.textbtn{border:0;background:none;color:var(--teal);font-weight:850}.sheetBody{padding:17px 17px 40px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800;color:#53615c}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e0dc;border-radius:14px;padding:13px;background:#fff}.field textarea{min-height:95px}.photos{display:flex;gap:8px;overflow:auto}.photos img{width:92px;height:72px;object-fit:cover;border-radius:12px}.smallcaps{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:850}.leaflet-control-attribution{font-size:9px!important}.leaflet-popup-content-wrapper{border-radius:16px}.leaflet-container a{color:var(--teal)}
@media(max-width:430px){.two{grid-template-columns:1fr}.weatherGrid{grid-template-columns:repeat(2,1fr)}.hero{height:285px}.heroText h2{font-size:26px}.quick{grid-template-columns:repeat(3,1fr);gap:5px}.bubble{width:46px;height:46px;font-size:22px}.quick small{font-size:10px}.profileGrid{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:110px 1fr}.waterHero{height:245px}}

<body>
<header class="topbar"><div class="brand"><div class="brandmark"><img src="assets/icons/icon-192.png" alt=""></div><div><div class="eyebrow" id="greeting">Fishing OS</div><h1 id="title">Dashboard</h1></div></div><button class="iconbtn" id="backup">☁︎</button></header>
<main id="view"></main>
<nav class="tabbar"><button class="tab active" data-tab="dashboard"><span>⌂</span><small>Dashboard</small></button><button class="tab" data-tab="map"><span>⌖</span><small>Karte</small></button><button class="fab" id="add">＋</button><button class="tab" data-tab="journal"><span>▤</span><small>Tagebuch</small></button><button class="tab" data-tab="stats"><span>▥</span><small>Statistik</small></button></nav>
<dialog id="modal"><div class="sheetHead"><button class="textbtn" id="close">Abbrechen</button><strong id="modalTitle"></strong><span style="width:72px"></span></div><div class="sheetBody" id="modalBody"></div></dialog>
<input id="importFile" type="file" accept="application/json" hidden>
<input id="heroFile" type="file" accept="image/*" hidden>
<input id="waterHeroFile" type="file" accept="image/*" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const APP_VERSION='0.5.0-dev2';
const STORE='fishingOS-v050-test';
const STORES=['waters','spots','days','events','lab','settings'];
let db,state={tab:'dashboard',map:null,mapMode:'satellite',waterProfile:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], now=()=>new Date().toISOString();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const date=v=>new Date(v).toLocaleDateString('de-DE'), time=v=>new Date(v).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const mins=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/60000));
function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(STORE,1);q.onupgradeneeded=e=>{let d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>j(q.error)})}
function all(s){return new Promise((r,j)=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>j(q.error)})}
function get(s,id){return new Promise((r,j)=>{let q=db.transaction(s).objectStore(s).get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}
function put(s,o){if(!o.id)o.id=crypto.randomUUID();return new Promise((r,j)=>{let tx=db.transaction(s,'readwrite');tx.objectStore(s).put(o);tx.oncomplete=()=>r(o);tx.onerror=()=>j(tx.error);tx.onabort=()=>j(tx.error)})}
function del(s,id){return new Promise((r,j)=>{let tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=r;tx.onerror=()=>j(tx.error)})}
async function data(){let a=await Promise.all(STORES.map(all));return Object.fromEntries(STORES.map((s,i)=>[s,a[i]]))}
async function migrate(){let d=await data();for(const w of d.waters){let changed=false;if(!Array.isArray(w.photos)){w.photos=[];changed=true}if(!w.profile){w.profile={};changed=true}if(typeof w.lat==='string' && Math.abs(+w.lat)>90){w.lat='';w.lon='';changed=true}if(changed)await put('waters',w)}for(const day of d.days){let changed=false;if(!Array.isArray(day.spotSessions)){day.spotSessions=[];changed=true}if(!Array.isArray(day.weatherSnapshots)){day.weatherSnapshots=[];changed=true}let sessions=[...(day.spotSessions||[])].sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));for(let i=0;i<sessions.length;i++){let x=sessions[i];if(x.endedAt)continue;let next=sessions[i+1]?.startedAt||day.endedAt;if(next&&new Date(next)>=new Date(x.startedAt)){x.endedAt=next;x.durationMin=mins(x.startedAt,next);changed=true}}if(changed)await put('days',day)}}
function show(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()} $('#close').onclick=()=>$('#modal').close();
function field(n,l,v='',t='text',x=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`}
function area(n,l,v=''){return `<div class="field"><label>${l}</label><textarea name="${n}">${esc(v)}</textarea></div>`}
function selectField(n,l,a,v=''){return `<div class="field"><label>${l}</label><select name="${n}"><option value="">– optional –</option>${a.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
async function imgs(files){return Promise.all([...files].map(f=>new Promise(r=>{let fr=new FileReader,im=new Image;fr.onload=e=>{im.onload=()=>{let c=document.createElement('canvas'),m=1400,k=Math.min(1,m/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.src=e.target.result};fr.readAsDataURL(f)})))}
function gpsOnce(){return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy}),reject,{enableHighAccuracy:true,timeout:12000,maximumAge:5000}):reject(new Error('GPS fehlt')))}
function weatherCode(c){if(c===0)return 'Klar';if([1,2].includes(c))return 'Leicht bewölkt';if(c===3)return 'Bewölkt';if([45,48].includes(c))return 'Nebel';if(c>=51&&c<=67)return 'Regen';if(c>=71&&c<=77)return 'Schnee';if(c>=80&&c<=82)return 'Schauer';if(c>=95)return 'Gewitter';return 'Wetter'}
function windDir(d){const dirs=['N','NO','O','SO','S','SW','W','NW'];return dirs[Math.round((((+d%360)+360)%360)/45)%8]}
function moonPhase(dt=new Date()){const syn=29.53058867,known=Date.UTC(2000,0,6,18,14),days=(dt.getTime()-known)/86400000,age=((days%syn)+syn)%syn,p=age/syn;let name=p<.03||p>.97?'Neumond':p<.22?'Zunehmende Sichel':p<.28?'Erstes Viertel':p<.47?'Zunehmender Mond':p<.53?'Vollmond':p<.72?'Abnehmender Mond':p<.78?'Letztes Viertel':'Abnehmende Sichel';return {name,age:+age.toFixed(1)}}
async function fetchWeather(lat,lon){const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;let r=await fetch(u);if(!r.ok)throw new Error('Wetterdienst nicht erreichbar');let j=await r.json(),c=j.current||{},m=moonPhase();return {at:now(),lat,lon,temp:c.temperature_2m,feels:c.apparent_temperature,humidity:c.relative_humidity_2m,precip:c.precipitation,code:c.weather_code,condition:weatherCode(c.weather_code),cloud:c.cloud_cover,pressure:c.surface_pressure,wind:c.wind_speed_10m,windDir:c.wind_direction_10m,windText:windDir(c.wind_direction_10m),gust:c.wind_gusts_10m,sunrise:j.daily?.sunrise?.[0],sunset:j.daily?.sunset?.[0],moon:m.name,moonAge:m.age}}
async function freshWeather(){let p=await gpsOnce();return fetchWeather(p.lat,p.lon)}
function weatherHTML(w){if(!w)return '<div class="warning">Wetter nicht verfügbar. Der Eintrag wird trotzdem lokal gespeichert.</div>';return `<div class="weatherGrid"><div class="weatherCell">🌤️<b>${w.temp??'–'} °C</b><small>${esc(w.condition||'')}</small></div><div class="weatherCell">🧭<b>${w.pressure??'–'} hPa</b><small>Luftdruck</small></div><div class="weatherCell">💨<b>${w.wind??'–'} km/h</b><small>${esc(w.windText||'')} · Böen ${w.gust??'–'}</small></div><div class="weatherCell">☁️<b>${w.cloud??'–'} %</b><small>Bewölkung</small></div><div class="weatherCell">💧<b>${w.humidity??'–'} %</b><small>Luftfeuchte</small></div><div class="weatherCell">🌙<b>${esc(w.moon||'–')}</b><small>Mondphase</small></div></div>${w.sunset?`<div class="muted" style="text-align:center;margin-top:10px">🌅 ${time(w.sunrise)} · 🌇 ${time(w.sunset)}</div>`:''}`}
function currentDay(d){return [...d.days].filter(x=>!x.endedAt).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0]}
function activeSpotSession(day){if(!day||day.endedAt)return null;return [...(day.spotSessions||[])].filter(s=>!s.endedAt).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0]}
function sessionEnd(day,s){return s?.endedAt||day?.endedAt||null}
function sessionMinutes(day,s){let end=sessionEnd(day,s);return end?mins(s.startedAt,end):mins(s.startedAt,now())}
function closeOpenSpotSessions(day,end=now()){day.spotSessions=day.spotSessions||[];let closed=0;for(const s of day.spotSessions){if(!s.endedAt){s.endedAt=end;s.durationMin=mins(s.startedAt,end);closed++}}return closed}
function et(t){return {catch:'Fang',bite:'Biss',lost:'Im Drill verloren',follow:'Nachläufer',observe:'Beobachtung',lureloss:'Köderverlust'}[t]||t}
function ei(t){return {catch:'🐟',bite:'🪝',lost:'🎣',follow:'🐠',observe:'🔭',lureloss:'💥'}[t]||'•'}
function sameDayMemory(events){let n=new Date();return events.filter(e=>{let d=new Date(e.at);return d.getFullYear()<n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}).sort((a,b)=>new Date(b.at)-new Date(a.at))[0]}
function appleMaps(lat,lon,label='Spot'){return `https://maps.apple.com/?daddr=${encodeURIComponent(lat)},${encodeURIComponent(lon)}&dirflg=d&q=${encodeURIComponent(label)}`}
function waterName(d,id){return d.waters.find(w=>w.id===id)?.name||'Ohne Gewässer'}
function spotLabel(d,id){let s=d.spots.find(x=>x.id===id);return s?`Spot ${s.number}${s.label?' · '+s.label:''}`:'Ohne Spot'}
function erow(e,d){let cls=e.type==='lost'||e.type==='lureloss'?' lost':'';let measure=[e.length?e.length+' cm':'',e.weightLb?e.weightLb+' lbs':''].filter(Boolean).join(' · ');return `<button class="row${cls}" data-event="${e.id}">${e.photos?.[0]?`<img src="${e.photos[0]}">`:`<div style="font-size:30px">${ei(e.type)}</div>`}<div class="grow"><h3>${et(e.type)}${e.species?' · '+esc(e.species):''}</h3><div class="muted">${esc(waterName(d,e.waterId))}${e.spotId?' · '+esc(spotLabel(d,e.spotId)):''}</div><div>${measure?`<b>${measure} · </b>`:''}${e.type==='lureloss'&&e.lossCause?`<b>${esc(e.lossCause)} · </b>`:''}${date(e.at)} ${time(e.at)}</div></div>›</button>`}
function bindEvents(d){$$('[data-event]').forEach(b=>b.onclick=()=>eventForm(null,d,d.events.find(x=>x.id===b.dataset.event)))}
