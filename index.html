function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(STORE,1);q.onupgradeneeded=e=>{let d=e.target.result;S.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>j(q.error)})}function all(s){return new Promise(r=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result||[])})}function put(s,o){if(!o.id)o.id=crypto.randomUUID();return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=()=>r(o)})}function del(s,id){return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=r})}async function data(){let a=await Promise.all(S.map(all));return Object.fromEntries(S.map((s,i)=>[s,a[i]]))}

function field(n,l,v='',t='text',x=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`}function select(n,l,a,v=''){return `<div class="field"><label>${l}</label><select name="${n}"><option value="">– optional –</option>${a.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}async function imgs(files){return Promise.all([...files].map(f=>new Promise(r=>{let fr=new FileReader,im=new Image;fr.onload=e=>{im.onload=()=>{let c=document.createElement('canvas'),m=1280,k=Math.min(1,m/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.src=e.target.result};fr.readAsDataURL(f)})))}function gps(){navigator.geolocation?.getCurrentPosition(p=>{$('[name=lat]').value=p.coords.latitude.toFixed(6);$('[name=lon]').value=p.coords.longitude.toFixed(6)},()=>alert('GPS konnte nicht gelesen werden.'))}

function dash(d){let day=curDay(d),ev=[...d.events].sort((a,b)=>new Date(b.at)-new Date(a.at))[0],w=ev?d.waters.find(x=>x.id===ev.waterId):d.waters[0],photo=ev?.photos?.[0]||w?.photos?.[0]||'assets/images/fishing-os-symbol.jpg',c=t=>d.events.filter(e=>e.type===t).length;$('#view').innerHTML=`<section class="card hero"><img src="${photo}"><div class="heroText"><small>${day?'Aktueller Angeltag':'Deine Angel-Datenbank'}</small><h2>${esc(w?.name||'Fishing OS')}</h2><div>${ev?et(ev.type)+(ev.species?' · '+esc(ev.species):'')+(ev.length?' · '+ev.length+' cm':''):'Bereit für den nächsten Trip?'}</div></div></section><div class="section"><h2>Deine Highlights</h2><button class="link" data-go="stats">Alle anzeigen</button></div><div class="grid4"><button class="metric" data-go="stats">🎣<b>${c('catch')}</b><small>Fänge</small></button><button class="metric" id="waters">🌊<b>${d.waters.length}</b><small>Gewässer</small></button><button class="metric" data-go="map">📍<b>${d.spots.length}</b><small>Spots</small></button><button class="metric" id="photos">📷<b>${d.events.reduce((n,e)=>n+(e.photos?.length||0),0)+d.spots.reduce((n,s)=>n+(s.photos?.length||0),0)+d.waters.reduce((n,w)=>n+(w.photos?.length||0),0)}</b><small>Fotos</small></button></div><div class="section"><h2>Angeltag</h2></div><div class="card">${day?`<b>${date(day.startedAt)}</b><p class="muted">Ein Angeltag · mehrere Gewässer · mehrere Zeitblöcke.</p><div class="two"><button class="btn" id="dayOpen">Fortsetzen</button><button class="btn secondary" id="dayEnd">Beenden</button></div>`:`<button class="btn full" id="dayNew">＋ Neuer Angeltag</button>`}</div><div class="section"><h2>Schneller Eintrag</h2></div><div class="quick">${[['catch','🐟','Fang','#51a938'],['bite','🪝','Biss','#f4a126'],['follow','🐠','Nachläufer','#2d8fdb'],['observe','🔭','Beobachtung','#7358db']].map(x=>`<button data-q="${x[0]}"><span class="bubble" style="background:${x[3]}">${x[1]}</span><small>${x[2]}</small></button>`).join('')}</div><div class="se function eventForm(type,d,o=null){type=o?.type||type;let b=curBlock(d),day=curDay(d),wid=o?.waterId||b?.waterId||state.water||'',sid=o?.spotId||b?.spotId||state.spot||'';show(o?'Ereignis bearbeiten':et(type)+' erfassen',`<form class="form" id="ef">${select('species','Fischart',['Schwarzbarsch','Zander','Barsch','Hecht'],o?.species)}<div class="two">${field('length','Länge (cm)',o?.length||'','number','step="0.1"')}${field('weight','Gewicht (kg)',o?.weight||'','number','step="0.01"')}</div>${select('lure','Köder',['Chatterbait','Texas Rig','Spinnerbait','Crankbait','Jerkbait','Softbait','Wobbler','Spinner','Jig','Topwater','Andere'],o?.lure)}<div class="two">${field('lureColor','Farbe',o?.lureColor||'')}${field('lureWeight','Ködergewicht (g)',o?.lureWeight||'','number','step="0.1"')}</div><div class="field"><label>Gewässer</label><select name="waterId"><option value="">– ohne –</option>${d.waters.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Spot</label><select name="spotId"><option value="">– ohne –</option>${d.spots.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>Spot ${s.number}${s.label?' · '+esc(s.label):''}</option>`).join('')}</select></div><div class="two">${field('at','Datum/Zeit',o?.at?new Date(o.at).toISOString().slice(0,16):new Date().toISOString().slice(0,16),'datetime-local')}${field('depth','Tiefe (m)',o?.depth||'','number','step="0.1"')}</div><div class="field"><label>Notizen</label><textarea name="notes">${esc(o?.notes||'')}</textarea></div><div class="field"><label>Fotos – Kamera oder Galerie, mehrere möglich</label><input name="photos" type="file" accept="image/*" multiple></div>${o?.photos?.length?`<div class="photos">${o.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}<button class="btn full">Speichern</button>${o?'<button class="btn danger full" type="button" id="edelete">Löschen</button>':''}</form>`);$('#ef').onsubmit=async e=>{e.prevent function nextSpot(d,wid){return Math.max(0,...d.spots.filter(s=>s.waterId===wid).map(s=>+s.number||0))+1}function srow(s,d){return `<button class="row" data-spot="${s.id}">${s.photos?.[0]?`<img src="${s.photos[0]}">`:'📍'}<div class="grow"><h3>Spot ${s.number}${s.label?' · '+esc(s.label):''}</h3><div class="muted">${d.events.filter(e=>e.spotId===s.id).length} Ereignisse · ${s.photos?.length||0} Fotos</div></div>›</button>`}function bindSpots(d){$$('[data-spot]').forEach(b=>b.onclick=()=>spotDetail(d.spots.find(s=>s.id===b.dataset.spot),d))}
function spotForm(d,wid='',o=null){wid=o?.waterId||wid||state.water||d.waters[0]?.id||'';let no=o?.number||nextSpot(d,wid);show(o?'Spot bearbeiten':'Neuen Spot erstellen',`<form id="sf" class="form"><div class="card"><b>Spot ${no}</b><div class="muted">Nummer automatisch und dauerhaft.</div></div><div class="field"><label>Gewässer</label><select name="waterId" required>${d.waters.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>${field('label','Optionaler Name',o?.label||'')}<div class="two">${field('lat','Breitengrad',o?.lat||'','number','step="any"')}${field('lon','Längengrad',o?.lon||'','number','step="any"')}</div><button class="btn secondary" type="button" id="sgps">⌖ Aktuelle GPS-Position</button><div class="field"><label>Notizen</label><textarea name="notes">${esc(o?.notes||'')}</textarea></div><div class="field"><label>Orientierungsfotos / Veränderungen – mehrere möglich</label><input name="photos" type="file" accept="image/*" multiple></div>${o?.photos?.length?`<div class="photos">${o.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}<button class="btn full">Speichern</button>${o?'<button class="btn danger full" type="button" id="sdelete">Spot löschen</button>':''}</form>`);$('#sgps').onclick=gps;$('#sf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),pp=await imgs(e.target.photos.files),sw=f.get('waterId'),x={...(o||{}),id:o?.id||crypto.randomUUID(),waterId:sw,number:o?.number||nextSpot(d,sw),label:f.get('label'),lat:f.get('lat'),lon:f.get('lon'),notes:f.get('notes'),photos:[...(o?.photos||[]),...pp],createdAt:o?.createdAt||now()};await put('spots',x);state.water=sw;state.spot=x.id;$('#modal').close();render()};$('#sdelete')?.addEventListener('click',async()=>{if(confirm('Spot wirklich löschen?')){await del('spots',o.id);$('#modal').close();render()}})}
function waterDetail(w,d){let sp=d.spots.filter(s=>s.waterId===w.id),ev=d.events.filter(e=>e.waterId===w.id),la=d.lab.filter(x=>x.waterId===w.id);show(w.name,`${w.photos?.length?`<div class="photos">${w.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}<div class="card"><p>${esc(w.notes||'Noch keine Notizen.')}</p><button class="btn secondary" id="wedit">Bearbeiten</button></div><div class="statgrid"><div class="stat"><b>${sp.length}</b><br>Spots</div><div class="stat"><b>${ev.length}</b><br>Ereignisse</div></div><div class="section"><h2>Spots</h2><button class="link" id="snew">＋ Spot</button></div>${sp.map(s=>srow(s,d)).join('')||'<div class="empty">Noch keine Spots.</div>'}<div class="section"><h2>Gewässer-Labor</h2><button class="link" id="lnew">＋ Eintrag</button></div>${la.map(l=>`<div class="row lab"><div><b>${esc(l.kind)}</b><div class="muted">${date(l.at)}</div><div>${esc(l.text)}</div></div></div>`).join('')||'<div class="empty">Noch keine Labor-Einträge.</div>'}`);$('#wedit').onclick=()=>waterForm(d,w);$('#snew').onclick=()=>spotForm(d,w.id);$('#lnew').onclick=()=>labForm(d,w.id);bindSpots(d)}
function spotDetail(s,d){let w=d.waters.find(x=>x.id===s.waterId),ev=d.events.filter(e=>e.spotId===s.id);show(`Spot ${s.number}${s.label?' · '+s.label:''}`,`${s.photos?.length?`<div class="photos">${s.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}<div class="card"><b>${esc(w?.name||'Ohne Gewässer')}</b><p>${esc(s.notes||'Noch keine Notizen.')}</p><div class="muted">${esc(s.lat||'–')}, ${esc(s.lon||'–')}</div><br><button class="btn secondary" id="sedit">Bearbeiten</button></div><div class="statgrid"><div class="stat"><b>${ev.filter(e=>e.type==='catch').length}</b><br>Fänge</div><div class="stat"><b>${ev.filter(e=>e.type==='bite').length}</b><br>Bisse</div><div class="stat"><b>${ev.filter(e=>e.type==='follow').length}</b><br>Nachläufer</div><div class="stat"><b>${s.photos?.length||0}</b><br>Fotos</div></div><div class="section"><h2>Historie</h2></div>${ev.sort((a,b)=>new Date(b.at)-new Date(a.at)).map(e=>erow(e,d)).join('')||'<div class="empty">Noch keine Ereignisse.</div>'}`);$('#sedit').onclick=()=>spotForm(d,s.waterId,s);bindEvents(d)}
function labForm(d,wid='',sid=''){show('Gewässer-Labor',`<form id="lf" class="form"><div class="field"><label>Typ</label><select name="kind"><option>Beobachtung</option><option>Hypothese</option><option>Experiment</option><option>Erkenntnis</option></select></div><div class="field"><label>Gewässer</label><select name="waterId"><option value="">– optional –</option>${d.waters.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Spot</label><select name="spotId"><option value="">– optional –</option>${d.spots.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>Spot ${s.number}${s.label?' · '+esc(s.label):''}</option>`).join('')}</select></div><div class="field"><label>Text</label><textarea name="text" required placeholder="Beobachtung, Hypothese oder Versuch dokumentieren …"></textarea></div><button class="btn full">Speichern</button></form>`);$('#lf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await put('lab',{id:crypto.randomUUID(),kind:f.get('kind'),waterId:f.get('waterId'),spotId:f.get('spotId'),text:f.get('text'),at:now()});$('#modal').close();render()}}
function dayForm(d){show('Neuer Angeltag',`<form id="df" class="form">${field('date','Datum',new Date().toISOString().slice(0,10),'date')}<div class="field"><label>Notizen (optional)</label><textarea name="notes"></textarea></div><button class="btn full">Angeltag starten</button></form>`);$('#df').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x={id:crypto.randomUUID(),startedAt:new Date(f.get('date')+'T00:00').toISOString(),endedAt:'',notes:f.get('notes')};await put('days',x);$('#modal').close();let nd=await data();blockForm(nd,x.id)}}function blockForm(d,dayId,o=null){show(o?'Zeitblock bearbeiten':'Zeitblock starten',`<form id="bf" class="form"><div class="field"><label>Gewässer</label><select name="waterId" required>${d.waters.map(w=>`<option value="${w.id}" ${w.id===(o?.waterId||state.water)?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>${field('start','Start',o?.startedAt?new Date(o.startedAt).toISOString().slice(0,16):new Date().toISOString().slice(0,16),'datetime-local')}${field('end','Ende (optional)',o?.endedAt?new Date(o.endedAt).toISOString().slice(0,16):'','datetime-local')}<button class="btn full">Speichern</button></form>`);$('#bf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x={...(o||{}),id:o?.id||crypto.randomUUID(),dayId,waterId:f.get('waterId'),spotId:o?.spotId||'',startedAt:new Date(f.get('start')).toISOString(),endedAt:f.get('end')?new Date(f.get('end')).toISOString():''};await put('blocks',x);state.water=x.waterId;$('#modal').close();render()}}
function dayDetail(day,d){let bs=d.blocks.filter(b=>b.dayId===day.id).sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt)),ev=d.events.filter(e=>e.dayId===day.id);show('Angeltag '+date(day.startedAt),`<button class="btn full" id="bnew">＋ Zeitblock</button><div class="section"><h2>Zeitblöcke</h2></div><div class="timeline">${bs.map(b=>{let w=d.waters.find(x=>x.id===b.waterId),s=d.spots.find(x=>x.id===b.spotId);return `<div class="event"><b>${time(b.startedAt)} – ${b.endedAt?time(b.endedAt):'läuft'}</b><div>${esc(w?.name||'')}</div><div class="muted">${s?'Spot '+s.number+(s.label?' · '+esc(s.label):''):'Kein Spot gewählt'}</div></div>`}).join('')||'<div class="empty">Noch keine Zeitblöcke.</div>'}</div><div class="section"><h2>Ereignisse</h2></div>${ev.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(e=>erow(e,d)).join('')||'<div class="empty">Noch keine Ereignisse.</div>'}`);$('#bnew').onclick=()=>blockForm(d,day.id);bindEvents(d)}
function spotSwitch(d){let b=curBlock(d),wid=b?.waterId||state.water||d.waters[0]?.id;if(!wid)return waterList(d);let sp=d.spots.filter(s=>s.waterId===wid);show('Spot wechseln',`<button class="btn full" id="spotCreate">＋ Neuen Spot erstellen</button><div style="margin-top:12px">${sp.map(s=>srow(s,d)).join('')||'<div class="empty">Noch keine Spots.</div>'}</div>`);$('#spotCreate').onclick=()=>spotForm(d,wid);$$('[data-spot]').forEach(x=>x.onclick=async()=>{state.spot=x.dataset.spot;if(b){b.spotId=state.spot;await put('blocks',b)}$('#modal').close();render()})}
function mapv(d){let pts=[...d.waters.filter(x=>x.lat&&x.lon).map(x=>({...x,k:'water'})),...d.spots.filter(x=>x.lat&&x.lon).map(x=>({...x,k:'spot'}))],la=pts.map(p=>+p.lat),lo=pts.map(p=>+p.lon),minA=Math.min(...la,0),maxA=Math.max(...la,1),minO=Math.min(...lo,0),maxO=Math.max(...lo,1),pos=p=>`left:${10+80*((+p.lon-minO)/(maxO-minO||1))}%;top:${90-80*((+p.lat-minA)/(maxA-minA||1))}%`;$('#view').innerHTML=`<div class="map">${pts.map(p=>`<button class="marker ${p.k}" style="${pos(p)}" data-map="${p.id}" data-kind="${p.k}">${p.k==='spot'?p.number:'●'}</button>`).join('')}</div><div class="mapNote">Offline-Orientierung: Deine gespeicherten GPS-Punkte bleiben sichtbar. Diese Ansicht ist bewusst schematisch und ersetzt keine vollständige Straßen-/Satellitenkarte.</div><div class="two" style="margin-top:10px"><button class="btn" id="mspot">＋ Spot markieren</button><button class="btn secondary" id="mwater">＋ Gewässer</button></div><div class="section"><h2>Spots</h2><button class="link" id="switch">Spot wechseln</button></div>${d.spots.map(s=>srow(s,d)).join('')||'<div class="empty">Noch keine Spots.</div>'}`;$('#mspot').onclick=()=>spotForm(d,state.water||d.waters[0]?.id);$('#mwater').onclick=()=>waterForm(d);$('#switch').onclick=()=>spotSwitch(d);bindSpots(d);$$('[data-map]').forEach(b=>b.onclick=()=>b.dataset.kind==='spot'?spotDetail(d.spots.find(s=>s.id===b.dataset.map),d):waterDetail(d.waters.find(w=>w.id===b.dataset.map),d))}
function journal(d){let ds=[...d.days].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));$('#view').innerHTML=`<div class="section"><h2>Deine Angeltage</h2><button class="link" id="jnew">＋ Neu</button></div>${ds.map(x=>{let ev=d.events.filter(e=>e.dayId===x.id),ws=[...new Set(d.blocks.filter(b=>b.dayId===x.id).map(b=>d.waters.find(w=>w.id===b.waterId)?.name).filter(Boolean))],p=ev.find(e=>e.photos?.length)?.photos?.[0];return `<button class="row" data-day="${x.id}">${p?`<img src="${p}">`:'📖'}<div class="grow"><h3>${date(x.startedAt)}</h3><div>${esc(ws.join(' & ')||'Ohne Gewässer')}</div><div class="muted">${ev.length} Ereignisse${x.notes?' · '+esc(x.notes):''}</div></div>›</button>`}).join('')||'<div class="empty">Noch keine Angeltage.</div>'}`;$('#jnew').onclick=()=>dayForm(d);$$('[data-day]').forEach(b=>b.onclick=()=>dayDetail(d.days.find(x=>x.id===b.dataset.day),d))}
function stats(d){let c=t=>d.events.filter(e=>e.type===t).length,act=c('catch')+c('bite')+c('follow'),hrs=Array.from({length:24},(_,h)=>d.events.filter(e=>['catch','bite','follow'].includes(e.type)&&new Date(e.at).getHours()===h).length),mh=Math.max(...hrs,1),bw=d.waters.map(w=>({w,n:d.events.filter(e=>e.waterId===w.id&&['catch','bite','follow'].includes(e.type)).length})).sort((a,b)=>b.n-a.n),sp={};d.events.filter(e=>e.type==='catch'&&e.species).forEach(e=>sp[e.species]=(sp[e.species]||0)+1),lu={};d.events.filter(e=>['catch','bite','follow'].includes(e.type)&&e.lure).forEach(e=>lu[e.lure]=(lu[e.lure]||0)+1);$('#view').innerHTML=`<div class="statgrid"><div class="stat"><b>${d.days.length}</b><br>Angeltage</div><div class="stat"><b>${act}</b><br>Aktivität</div><div class="stat"><b>${c('catch')}</b><br>Fänge</div><div class="stat"><b>${c('bite')}</b><br>Bisse</div><div class="stat"><b>${c('follow')}</b><br>Nachläufer</div><div class="stat"><b>${d.spots.length}</b><br>Spots</div></div><div class="section"><h2>Aktivität nach Uhrzeit</h2></div><div class="card"><div style="height:120px;display:flex;align-items:flex-end;gap:3px">${hrs.map(n=>`<div style="flex:1;height:${Math.max(3,n/mh*100)}%;background:${n?'var(--teal)':'#e5ece8'};border-radius:4px 4px 0 0"></div>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div><div class="section"><h2>Erfolg nach Gewässer</h2></div>${bw.map(x=>`<div class="row"><div class="grow"><b>${esc(x.w.name)}</b><div class="muted">Fang + Biss + Nachläufer</div></div><b>${x.n}</b></div>`).join('')||'<div class="empty">Noch keine Daten.</div>'}<div class="section"><h2>Fischarten</h2></div>${Object.entries(sp).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="row"><div class="grow">${esc(k)}</div><b>${n}</b></div>`).join('')||'<div class="empty">Noch keine Fänge.</div>'}<div class="section"><h2>Köder-Aktivität</h2></div>${Object.entries(lu).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="row"><div class="grow">${esc(k)}</div><b>${n}</b></div>`).join('')||'<div class="empty">Noch keine Köderdaten.</div>'}`}
function gallery(d){let p=[...d.waters.flatMap(w=>(w.photos||[]).map(x=>({x,l:w.name}))),...d.spots.flatMap(s=>(s.photos||[]).map(x=>({x,l:'Spot '+s.number}))),...d.events.flatMap(e=>(e.photos||[]).map(x=>({x,l:et(e.type)})))];show('Galerie',`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${p.map(a=>`<div><img src="${a.x}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px"><small>${esc(a.l)}</small></div>`).join('')||'<div class="empty">Noch keine Fotos.</div>'}</div>`)}
$('#add').onclick=async()=>{let d=await data();show('Schneller Eintrag',`<div class="quick" style="grid-template-columns:repeat(2,1fr)">${[['catch','🐟','Fang'],['bite','🪝','Biss'],['follow','🐠','Nachläufer'],['observe','🔭','Beobachtung']].map(x=>`<button class="card" data-qa="${x[0]}" style="font-size:20px">${x[1]}<br><b>${x[2]}</b></button>`).join('')}<button class="card" id="qspot">📍<br><b>Spot wechseln</b></button><button class="card" id="qwater">🌊<br><b>Gewässer</b></button><button class="card" id="qlab">🧪<br><b>Labor</b></button><button class="card" id="qday">🗓️<br><b>Angeltag</b></button></div>`);$$('[data-qa]').forEach(b=>b.onclick=()=>{$('#modal').close();eventForm(b.dataset.qa,d)});$('#qspot').onclick=()=>{$('#modal').close();spotSwitch(d)};$('#qwater').onclick=()=>{$('#modal').close();waterList(d)};$('#qlab').onclick=()=>{$('#modal').close();labForm(d)};$('#qday').onclick=()=>{$('#modal').close();let day=curDay(d);day?dayDetail(day,d):dayForm(d)}};
$('#backup').onclick=async()=>{show('Daten & Sicherung',`<div class="form"><button class="btn full" id="export">⇩ Sicherung exportieren</button><button class="btn secondary full" id="import">⇧ Sicherung importieren</button><p class="muted">Alle Daten bleiben lokal. Vor größeren Updates bitte exportieren.</p></div>`);$('#export').onclick=async()=>{let o={schema:'FishingOS',version:2,createdAt:now(),data:await data()},a=document.createElement('a'),blob=new Blob([JSON.stringify(o)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='FishingOS-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};$('#import').onclick=()=>$('#importFile').click()};$('#importFile').onchange=async e=>{try{let p=JSON.parse(await e.target.files[0].text());for(let s of S){let tx=db.transaction(s,'readwrite'),os=tx.objectStore(s);os.clear();(p.data?.[s]||[]).forEach(x=>os.put(x));await new Promise(r=>tx.oncomplete=r)}$('#modal').close();render();alert('Import abgeschlossen.')}catch(x){alert('Import fehlgeschlagen.')}};
document.addEventListener('click',async e=>{let b=e.target.closest('[data-event]');if(b){let d=await data();eventForm(null,d,d.events.find(x=>x.id===b.dataset.event))}});openDB().then(render);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
