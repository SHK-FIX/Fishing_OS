<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#17211f;--muted:#75817d;--line:#e1e7e4;--teal:#0aa0a8;--green:#55943b;--orange:#f4a126;--blue:#2d8fdb;--purple:#7459de;--shadow:0 10px 28px rgba(34,58,50,.08);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:96px}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:760px;margin:auto;padding:10px 17px 32px}.topbar{position:sticky;top:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 10px) 18px 12px;background:rgba(246,248,245,.94);backdrop-filter:blur(16px);display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brandmark{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:26px;box-shadow:var(--shadow)}.eyebrow{font-size:12px;color:var(--muted);font-weight:800}h1{font-size:30px;line-height:1;margin:2px 0 0}.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero{height:300px;position:relative;overflow:hidden;padding:0;background:linear-gradient(135deg,#adc9ca,#31524a)}.hero>img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 18%,rgba(4,21,18,.86))}.heroText{position:absolute;z-index:2;left:20px;right:20px;bottom:18px;color:#fff}.heroText h2{font-size:28px;margin:4px 0}.heroEdit{position:absolute;z-index:3;top:14px;left:14px;border:0;border-radius:999px;background:rgba(18,31,28,.72);color:#fff;padding:9px 12px;font-weight:800;backdrop-filter:blur(8px)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid #ffffff55;background:#162b2788;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:21px 4px 11px}.section h2{margin:0;font-size:22px}.link{border:0;background:none;color:var(--green);font-weight:850}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px 3px;text-align:center;box-shadow:0 4px 14px #00000008}.metric b{display:block;font-size:24px;margin:3px}.metric small,.muted{color:var(--muted)}.weatherGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weatherCell{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:center}.weatherCell b{display:block;font-size:17px}.weatherCell small{color:var(--muted)}.btn{border:0;border-radius:14px;padding:13px 15px;background:var(--teal);color:#fff;font-weight:850}.btn.secondary{background:#edf3f0;color:var(--ink)}.btn.danger{background:#fff0ee;color:#b33627}.full{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{border:0;background:none}.bubble{width:56px;height:56px;margin:auto;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:27px}.quick small{display:block;margin-top:6px}.row{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:9px;text-align:left;width:100%}.row img{width:70px;height:70px;object-fit:cover;border-radius:14px}.grow{flex:1}.row h3{margin:0 0 4px}.memory{border-left:4px solid var(--orange)}.lab{border-left:4px solid var(--purple)}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#edf3f0;font-size:11px;font-weight:800}.map{height:445px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#dce8e4}.mapNote{font-size:12px;color:var(--muted);margin:8px 3px}.mapActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px}.stat b{font-size:28px}.statline{display:flex;justify-content:space-between;gap:10px;align-items:center}.timeline{border-left:3px solid #dbe5df;padding-left:18px;margin-left:9px}.event{position:relative;margin-bottom:15px}.event:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal);position:absolute;left:-25px;top:3px;border:3px solid var(--bg)}.notice{padding:12px 14px;border-radius:15px;background:#eef6f5;color:#31514a;font-size:13px}.empty{text-align:center;padding:26px;color:var(--muted)}.tabbar{position:fixed;z-index:1200;bottom:0;left:0;right:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 82px 1fr 1fr;align-items:center}.tab{border:0;background:none;color:#7e8985}.tab.active{color:var(--teal)}.tab span{display:block;font-size:21px}.tab small{font-size:10px}.fab{width:62px;height:62px;border-radius:50%;border:6px solid var(--bg);background:var(--teal);color:#fff;font-size:34px;transform:translateY(-15px);box-shadow:var(--shadow)}dialog{width:min(100%,760px);height:90vh;max-height:900px;border:0;border-radius:27px 27px 0 0;padding:0;margin:auto auto 0;background:var(--bg);z-index:2000}dialog::backdrop{background:#0006}.sheetHead{position:sticky;top:0;z-index:3;padding:17px;background:rgba(246,248,245,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.textbtn{border:0;background:none;color:var(--teal);font-weight:850}.sheetBody{padding:17px 17px 40px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800;color:#53615c}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e0dc;border-radius:14px;padding:13px;background:#fff}.field textarea{min-height:95px}.photos{display:flex;gap:8px;overflow:auto}.photos img{width:92px;height:72px;object-fit:cover;border-radius:12px}.smallcaps{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:850}.heroPickerPreview{width:100%;max-height:240px;object-fit:cover;border-radius:16px}.leaflet-control-attribution{font-size:9px!important}.leaflet-popup-content-wrapper{border-radius:16px}.leaflet-container a{color:var(--teal)}
@media(max-width:430px){.quick{gap:3px}.bubble{width:52px;height:52px}.two{grid-template-columns:1fr}.weatherGrid{grid-template-columns:repeat(2,1fr)}.hero{height:285px}.heroText h2{font-size:26px}}
</style>

<body>
<header class="topbar"><div class="brand"><div class="brandmark">🎣</div><div><div class="eyebrow" id="greeting">Fishing OS</div><h1 id="title">Dashboard</h1></div></div><button class="iconbtn" id="backup">☁︎</button></header>
<main id="view"></main>
<nav class="tabbar"><button class="tab active" data-tab="dashboard"><span>⌂</span><small>Dashboard</small></button><button class="tab" data-tab="map"><span>⌖</span><small>Karte</small></button><button class="fab" id="add">＋</button><button class="tab" data-tab="journal"><span>▤</span><small>Tagebuch</small></button><button class="tab" data-tab="stats"><span>▥</span><small>Statistik</small></button></nav>
<dialog id="modal"><div class="sheetHead"><button class="textbtn" id="close">Abbrechen</button><strong id="modalTitle"></strong><span style="width:72px"></span></div><div class="sheetBody" id="modalBody"></div></dialog>
<input id="importFile" type="file" accept="application/json" hidden><input id="heroFile" type="file" accept="image/*" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const STORE='fishingOS-v030'; const STORES=['waters','spots','days','events','lab','settings'];
let db,state={tab:'dashboard',map:null}; const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], now=()=>new Date().toISOString();
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const date=v=>new Date(v).toLocaleDateString('de-DE'), time=v=>new Date(v).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(STORE,1);q.onupgradeneeded=e=>{let d=e.target.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};q.onsuccess=e=>{db=e.target.result;r()};q.onerror=()=>j(q.error)})}
function all(s){return new Promise(r=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result||[])})}
function get(s,id){return new Promise(r=>{let q=db.transaction(s).objectStore(s).get(id);q.onsuccess=()=>r(q.result)})}
function put(s,o){if(!o.id)o.id=crypto.randomUUID();return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).put(o);q.onsuccess=()=>r(o)})}
function del(s,id){return new Promise(r=>{let q=db.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=r})}
async function data(){let a=await Promise.all(STORES.map(all));return Object.fromEntries(STORES.map((s,i)=>[s,a[i]]))}
function show(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()} $('#close').onclick=()=>$('#modal').close();
function field(n,l,v='',t='text',x=''){return `<div class="field"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`}
function select(n,l,a,v=''){return `<div class="field"><label>${l}</label><select name="${n}"><option value="">– optional –</option>${a.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
async function imgs(files){return Promise.all([...files].map(f=>new Promise(r=>{let fr=new FileReader,im=new Image;fr.onload=e=>{im.onload=()=>{let c=document.createElement('canvas'),m=1400,k=Math.min(1,m/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.src=e.target.result};fr.readAsDataURL(f)})))}
function gpsOnce(){return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve({lat:p.coords.latitude,lon:p.coords.longitude}),reject,{enableHighAccuracy:true,timeout:12000}):reject(new Error('GPS fehlt')))}
function weatherCode(c){if(c===0)return 'Klar';if([1,2].includes(c))return 'Leicht bewölkt';if(c===3)return 'Bewölkt';if([45,48].includes(c))return 'Nebel';if(c>=51&&c<=67)return 'Regen';if(c>=71&&c<=77)return 'Schnee';if(c>=80&&c<=82)return 'Schauer';if(c>=95)return 'Gewitter';return 'Wetter'}
function windDir(d){const dirs=['N','NO','O','SO','S','SW','W','NW'];return dirs[Math.round((((+d%360)+360)%360)/45)%8]}
function moonPhase(dt=new Date()){const syn=29.53058867, known=Date.UTC(2000,0,6,18,14), days=(dt.getTime()-known)/86400000, age=((days%syn)+syn)%syn, p=age/syn;let name=p<.03||p>.97?'Neumond':p<.22?'Zunehmende Sichel':p<.28?'Erstes Viertel':p<.47?'Zunehmender Mond':p<.53?'Vollmond':p<.72?'Abnehmender Mond':p<.78?'Letztes Viertel':'Abnehmende Sichel';return {name,age:+age.toFixed(1)}}
async function fetchWeather(lat,lon){const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;let r=await fetch(u);if(!r.ok)throw new Error('Wetterdienst nicht erreichbar');let j=await r.json(),c=j.current||{},m=moonPhase();return {at:now(),lat,lon,temp:c.temperature_2m,feels:c.apparent_temperature,humidity:c.relative_humidity_2m,precip:c.precipitation,code:c.weather_code,condition:weatherCode(c.weather_code),cloud:c.cloud_cover,pressure:c.surface_pressure,wind:c.wind_speed_10m,windDir:c.wind_direction_10m,windText:windDir(c.wind_direction_10m),gust:c.wind_gusts_10m,sunrise:j.daily?.sunrise?.[0],sunset:j.daily?.sunset?.[0],moon:m.name,moonAge:m.age}}
function weatherHTML(w){if(!w)return '<div class="notice">Noch keine Wetterdaten gespeichert.</div>';return `<div class="weatherGrid"><div class="weatherCell">🌤️<b>${w.temp??'–'} °C</b><small>${esc(w.condition||'')}</small></div><div class="weatherCell">🧭<b>${w.pressure??'–'} hPa</b><small>Luftdruck</small></div><div class="weatherCell">💨<b>${w.wind??'–'} km/h</b><small>${esc(w.windText||'')} · Böen ${w.gust??'–'}</small></div><div class="weatherCell">☁️<b>${w.cloud??'–'} %</b><small>Bewölkung</small></div><div class="weatherCell">💧<b>${w.humidity??'–'} %</b><small>Luftfeuchte</small></div><div class="weatherCell">🌙<b>${esc(w.moon||'–')}</b><small>Mondphase</small></div></div>${w.sunset?`<div class="muted" style="text-align:center;margin-top:10px">🌅 Sonnenaufgang ${time(w.sunrise)} · 🌇 Sonnenuntergang ${time(w.sunset)}</div>`:''}`}
function currentDay(d){return [...d.days].filter(x=>!x.endedAt).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0]}
function et(t){return {catch:'Fang',bite:'Biss',follow:'Nachläufer',observe:'Beobachtung'}[t]||t} function ei(t){return {catch:'🐟',bite:'🪝',follow:'🐠',observe:'🔭'}[t]||'•'}
function sameDayMemory(events){let n=new Date();return events.filter(e=>{let d=new Date(e.at);return d.getFullYear()<n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}).sort((a,b)=>new Date(b.at)-new Date(a.at))[0]}
function appleMaps(lat,lon,label='Spot'){return `https://maps.apple.com/?daddr=${encodeURIComponent(lat)},${encodeURIComponent(lon)}&dirflg=d&q=${encodeURIComponent(label)}`}
async function render(){let d=await data(),h=new Date().getHours();$('#greeting').textContent=`Guten ${h<11?'Morgen':h<18?'Tag':'Abend'}`;$('#title').textContent={dashboard:'Dashboard',map:'Karte',journal:'Tagebuch',stats:'Statistik'}[state.tab];$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(state.map){try{state.map.remove()}catch{}state.map=null}if(state.tab==='dashboard')dash(d);if(state.tab==='map')mapv(d);if(state.tab==='journal')journal(d);if(state.tab==='stats')stats(d)}
$$('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
function erow(e,d){let w=d.waters.find(x=>x.id===e.waterId),s=d.spots.find(x=>x.id===e.spotId);return `<button class="row" data-event="${e.id}">${e.photos?.[0]?`<img src="${e.photos[0]}">`:`<div style="font-size:30px">${ei(e.type)}</div>`}<div class="grow"><h3>${et(e.type)}${e.species?' · '+esc(e.species):''}</h3><div class="muted">${esc(w?.name||'Ohne Gewässer')}${s?' · Spot '+s.number+(s.label?' · '+esc(s.label):''):''}</div><div><b>${e.length?e.length+' cm · ':''}</b>${date(e.at)} ${time(e.at)}</div></div>›</button>`}
function bindEvents(d){$$('[data-event]').forEach(b=>b.onclick=()=>eventForm(null,d,d.events.find(x=>x.id===b.dataset.event)))}
async function dash(d){let day=currentDay(d),ev=[...d.events].sort((a,b)=>new Date(b.at)-new Date(a.at))[0],w=day?d.waters.find(x=>x.id===day.waterId):(ev?d.waters.find(x=>x.id===ev.waterId):d.waters[0]),hero=(await get('settings','hero'))?.value||w?.photos?.[0]||ev?.photos?.[0]||'',weather=day?.weather||null,mem=sameDayMemory(d.events),c=t=>d.events.filter(e=>e.type===t).length;$('#view').innerHTML=`<section class="card hero">${hero?`<img src="${hero}">`:''}<button class="heroEdit" id="heroEdit">✎ Bild ändern</button><div class="heroText"><small>${day?'Aktueller Angeltag':'Deine Angel-Datenbank'}</small><h2>${esc(w?.name||'Fishing OS')}</h2><div>${w?'Dein persönliches Angel-Archiv':'Bereit für den ersten Trip?'}</div>${weather?`<div class="chips"><span class="chip">🌡️ ${weather.temp} °C</span><span class="chip">🧭 ${weather.pressure} hPa</span><span class="chip">💨 ${weather.windText} ${weather.wind} km/h</span></div>`:''}</div></section><div class="section"><h2>Deine Highlights</h2><button class="link" data-go="stats">Alle anzeigen</button></div><div class="grid4"><button class="metric" data-go="stats">🎣<b>${c('catch')}</b><small>Fänge</small></button><button class="metric" id="waters">🌊<b>${d.waters.length}</b><small>Gewässer</small></button><button class="metric" data-go="map">📍<b>${d.spots.length}</b><small>Spots</small></button><button class="metric" id="photos">📷<b>${d.events.reduce((n,e)=>n+(e.photos?.length||0),0)+d.spots.reduce((n,s)=>n+(s.photos?.length||0),0)+d.waters.reduce((n,w)=>n+(w.photos?.length||0),0)}</b><small>Fotos</small></button></div><div class="section"><h2>Angeltag</h2></div><div class="card">${day?`<div class="smallcaps">Läuft seit ${time(day.startedAt)}</div><h3 style="margin:6px 0">${esc(w?.name||'Ohne Gewässer')}</h3>${weatherHTML(weather)}<div class="two" style="margin-top:12px"><button class="btn" id="weatherRefresh">Wetter aktualisieren</button><button class="btn secondary" id="dayEnd">Angeltag beenden</button></div>`:`<button class="btn full" id="dayNew">＋ Neuer Angeltag</button>`}</div>${mem?`<div class="section"><h2>Heute vor einem Jahr</h2></div><button class="row memory" data-event="${mem.id}">${mem.photos?.[0]?`<img src="${mem.photos[0]}">`:`<div style="font-size:30px">🕰️</div>`}<div class="grow"><h3>${et(mem.type)}${mem.species?' · '+esc(mem.species):''}</h3><div>${date(mem.at)} · ${time(mem.at)}</div><div class="muted">${mem.weather?`${mem.weather.temp} °C · ${mem.weather.pressure} hPa · ${mem.weather.windText}`:'Aus deinem Archiv'}</div></div>›</button>`:''}<div class="section"><h2>Schneller Eintrag</h2></div><div class="quick">${[['catch','🐟','Fang','#51a938'],['bite','🪝','Biss','#f4a126'],['follow','🐠','Nachläufer','#2d8fdb'],['observe','🔭','Beobachtung','#7358db']].map(x=>`<button data-q="${x[0]}"><span class="bubble" style="background:${x[3]}">${x[1]}</span><small>${x[2]}</small></button>`).join('')}</div><div class="section"><h2>Letzte Ereignisse</h2></div>${[...d.events].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,5).map(e=>erow(e,d)).join('')||'<div class="empty">Noch keine Ereignisse.</div>'}`;
$('#heroEdit').onclick=()=>$('#heroFile').click();$('#heroFile').onchange=async e=>{let p=await imgs(e.target.files);if(p[0]){await put('settings',{id:'hero',value:p[0]});render()}};$$('[data-q]').forEach(b=>b.onclick=()=>eventForm(b.dataset.q,d));$$('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;render()});$('#waters').onclick=()=>waterList(d);$('#photos').onclick=()=>gallery(d);$('#dayNew')?.addEventListener('click',()=>dayForm(d));$('#dayEnd')?.addEventListener('click',async()=>{day.endedAt=now();day.catchCount=d.events.filter(e=>e.dayId===day.id&&e.type==='catch').length;await put('days',day);render()});$('#weatherRefresh')?.addEventListener('click',async()=>{try{let pos=await gpsOnce(),wx=await fetchWeather(pos.lat,pos.lon);day.weather=wx;await put('days',day);render()}catch(e){alert('Wetter konnte nicht aktualisiert werden.')}});bindEvents(d)}
function waterList(d){show('Gewässer',`<button class="btn full" id="wnew">＋ Neues Gewässer</button><div style="margin-top:12px">${d.waters.map(w=>`<button class="row" data-water="${w.id}">${w.photos?.[0]?`<img src="${w.photos[0]}">`:'🌊'}<div class="grow"><h3>${esc(w.name)}</h3><div class="muted">${d.spots.filter(s=>s.waterId===w.id).length} Spots · ${d.events.filter(e=>e.waterId===w.id).length} Ereignisse</div></div>›</button>`).join('')||'<div class="empty">Noch keine Gewässer.</div>'}</div>`);$('#wnew').onclick=()=>waterForm(d);$$('[data-water]').forEach(b=>b.onclick=()=>waterDetail(d.waters.find(w=>w.id===b.dataset.water),d))}
function waterForm(d,o=null){show(o?'Gewässer bearbeiten':'Neues Gewässer',`<form id="wf" class="form">${field('name','Name',o?.name||'','','required')}<div class="two">${field('lat','Breitengrad',o?.lat||'','number','step="any"')}${field('lon','Längengrad',o?.lon||'','number','step="any"')}</div><button class="btn secondary" type="button" id="wgps">⌖ Aktuelle GPS-Position</button><div class="field"><label>Notizen</label><textarea name="notes">${esc(o?.notes||'')}</textarea></div><div class="field"><label>Fotos</label><input name="photos" type="file" accept="image/*" multiple></div><button class="btn full">Speichern</button>${o?'<button class="btn danger full" type="button" id="wdelete">Löschen</button>':''}</form>`);$('#wgps').onclick=async()=>{try{let p=await gpsOnce();$('[name=lat]').value=p.lat.toFixed(6);$('[name=lon]').value=p.lon.toFixed(6)}catch{alert('GPS konnte nicht gelesen werden.')}};$('#wf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),pp=await imgs(e.target.photos.files),x={...(o||{}),id:o?.id||crypto.randomUUID(),name:f.get('name'),lat:f.get('lat'),lon:f.get('lon'),notes:f.get('notes'),photos:[...(o?.photos||[]),...pp],createdAt:o?.createdAt||now()};await put('waters',x);$('#modal').close();render()};$('#wdelete')?.addEventListener('click',async()=>{if(confirm('Gewässer wirklich löschen?')){await del('waters',o.id);$('#modal').close();render()}})}
function nextSpot(d,wid){return Math.max(0,...d.spots.filter(s=>s.waterId===wid).map(s=>+s.number||0))+1}
function spotForm(d,wid='',o=null){wid=o?.waterId||wid||d.waters[0]?.id||'';let no=o?.number||nextSpot(d,wid);show(o?'Spot bearbeiten':'Neuer Spot',`<form id="sf" class="form"><div class="notice"><b>Spot ${no}</b> · Nummer bleibt dauerhaft.</div><div class="field"><label>Gewässer</label><select name="waterId" required>${d.waters.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>${field('label','Name / Bezeichnung',o?.label||'')}<div class="two">${field('lat','Breitengrad',o?.lat||'','number','step="any"')}${field('lon','Längengrad',o?.lon||'','number','step="any"')}</div><button class="btn secondary" type="button" id="sgps">⌖ Aktuelle GPS-Position</button><div class="field"><label>Notizen</label><textarea name="notes">${esc(o?.notes||'')}</textarea></div><div class="field"><label>Fotos</label><input name="photos" type="file" accept="image/*" multiple></div><button class="btn full">Speichern</button>${o?'<button class="btn danger full" type="button" id="sdelete">Löschen</button>':''}</form>`);$('#sgps').onclick=async()=>{try{let p=await gpsOnce();$('[name=lat]').value=p.lat.toFixed(6);$('[name=lon]').value=p.lon.toFixed(6)}catch{alert('GPS konnte nicht gelesen werden.')}};$('#sf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),pp=await imgs(e.target.photos.files),sw=f.get('waterId'),x={...(o||{}),id:o?.id||crypto.randomUUID(),waterId:sw,number:o?.number||nextSpot(d,sw),label:f.get('label'),lat:f.get('lat'),lon:f.get('lon'),notes:f.get('notes'),photos:[...(o?.photos||[]),...pp],createdAt:o?.createdAt||now()};await put('spots',x);$('#modal').close();render()};$('#sdelete')?.addEventListener('click',async()=>{if(confirm('Spot wirklich löschen?')){await del('spots',o.id);$('#modal').close();render()}})}
function waterDetail(w,d){let sp=d.spots.filter(s=>s.waterId===w.id),ev=d.events.filter(e=>e.waterId===w.id);show(w.name,`${w.photos?.[0]?`<img class="heroPickerPreview" src="${w.photos[0]}">`:''}<div class="card"><p>${esc(w.notes||'Noch keine Notizen.')}</p>${w.lat&&w.lon?`<a class="btn secondary" style="display:block;text-align:center;text-decoration:none" target="_blank" href="${appleMaps(w.lat,w.lon,w.name)}">In Apple Karten öffnen</a>`:''}<button class="btn secondary full" id="wedit" style="margin-top:8px">Bearbeiten</button></div><div class="statgrid"><div class="stat"><b>${sp.length}</b><br>Spots</div><div class="stat"><b>${ev.filter(e=>e.type==='catch').length}</b><br>Fänge</div></div><div class="section"><h2>Spots</h2><button class="link" id="snew">＋ Spot</button></div>${sp.map(s=>`<button class="row" data-spot="${s.id}"><div style="font-size:26px">📍</div><div class="grow"><h3>Spot ${s.number}${s.label?' · '+esc(s.label):''}</h3><div class="muted">${d.events.filter(e=>e.spotId===s.id).length} Ereignisse</div></div>›</button>`).join('')||'<div class="empty">Noch keine Spots.</div>'}`);$('#wedit').onclick=()=>waterForm(d,w);$('#snew').onclick=()=>spotForm(d,w.id);$$('[data-spot]').forEach(b=>b.onclick=()=>spotDetail(d.spots.find(s=>s.id===b.dataset.spot),d))}
function spotDetail(s,d){let w=d.waters.find(x=>x.id===s.waterId),ev=d.events.filter(e=>e.spotId===s.id);show(`Spot ${s.number}${s.label?' · '+s.label:''}`,`${s.photos?.[0]?`<img class="heroPickerPreview" src="${s.photos[0]}">`:''}<div class="card"><b>${esc(w?.name||'Ohne Gewässer')}</b><p>${esc(s.notes||'Noch keine Notizen.')}</p>${s.lat&&s.lon?`<a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" href="${appleMaps(s.lat,s.lon,'Spot '+s.number)}">🧭 Navigation mit Apple Karten</a>`:''}<button class="btn secondary full" id="sedit" style="margin-top:8px">Bearbeiten</button></div><div class="statgrid"><div class="stat"><b>${ev.filter(e=>e.type==='catch').length}</b><br>Fänge</div><div class="stat"><b>${ev.filter(e=>e.type==='bite').length}</b><br>Bisse</div></div><div class="section"><h2>Historie</h2></div>${ev.sort((a,b)=>new Date(b.at)-new Date(a.at)).map(e=>erow(e,d)).join('')||'<div class="empty">Noch keine Ereignisse.</div>'}`);$('#sedit').onclick=()=>spotForm(d,s.waterId,s);bindEvents(d)}
function dayForm(d){if(!d.waters.length)return waterForm(d);show('Neuer Angeltag',`<form id="df" class="form"><div class="field"><label>Gewässer</label><select name="waterId" required>${d.waters.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Notizen</label><textarea name="notes" placeholder="Plan, Ziel, Bedingungen …"></textarea></div><button class="btn full">Angeltag starten + Wetter holen</button></form>`);$('#df').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),wid=f.get('waterId'),w=d.waters.find(x=>x.id===wid),wx=null;try{let p;try{p=await gpsOnce()}catch{if(w?.lat&&w?.lon)p={lat:+w.lat,lon:+w.lon}}if(p)wx=await fetchWeather(p.lat,p.lon)}catch{}let x={id:crypto.randomUUID(),waterId:wid,startedAt:now(),endedAt:'',notes:f.get('notes'),weather:wx};await put('days',x);$('#modal').close();render()}}
function eventForm(type,d,o=null){type=o?.type||type;let day=currentDay(d),wid=o?.waterId||day?.waterId||d.waters[0]?.id||'',sid=o?.spotId||'';show(o?'Ereignis bearbeiten':et(type)+' erfassen',`<form class="form" id="ef">${select('species','Fischart',['Schwarzbarsch','Zander','Barsch','Hecht','Andere'],o?.species)}<div class="two">${field('length','Länge (cm)',o?.length||'','number','step="0.1"')}${field('weight','Gewicht (kg)',o?.weight||'','number','step="0.01"')}</div>${select('lure','Köder',['Chatterbait','Texas Rig','Spinnerbait','Crankbait','Jerkbait','Softbait','Wobbler','Spinner','Jig','Topwater','Andere'],o?.lure)}<div class="field"><label>Gewässer</label><select name="waterId"><option value="">– ohne –</option>${d.waters.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Spot</label><select name="spotId"><option value="">– ohne –</option>${d.spots.filter(s=>!wid||s.waterId===wid).map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>Spot ${s.number}${s.label?' · '+esc(s.label):''}</option>`).join('')}</select></div><div class="two">${field('at','Datum/Zeit',o?.at?new Date(o.at).toISOString().slice(0,16):new Date().toISOString().slice(0,16),'datetime-local')}${field('depth','Tiefe (m)',o?.depth||'','number','step="0.1"')}</div><div class="field"><label>Notizen</label><textarea name="notes">${esc(o?.notes||'')}</textarea></div><div class="field"><label>Fotos</label><input name="photos" type="file" accept="image/*" multiple></div><label class="notice"><input type="checkbox" name="autoWeather" checked> Wetter-Snapshot automatisch speichern</label><button class="btn full">Speichern</button>${o?'<button class="btn danger full" type="button" id="edelete">Löschen</button>':''}</form>`);$('#ef').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),pp=await imgs(e.target.photos.files),wx=o?.weather||day?.weather||null;if(f.get('autoWeather')){try{let p=await gpsOnce();wx=await fetchWeather(p.lat,p.lon)}catch{}}let x={...(o||{}),id:o?.id||crypto.randomUUID(),type,species:f.get('species'),length:f.get('length'),weight:f.get('weight'),lure:f.get('lure'),waterId:f.get('waterId'),spotId:f.get('spotId'),dayId:o?.dayId||day?.id||'',depth:f.get('depth'),notes:f.get('notes'),at:new Date(f.get('at')).toISOString(),photos:[...(o?.photos||[]),...pp],weather:wx};await put('events',x);$('#modal').close();render()};$('#edelete')?.addEventListener('click',async()=>{if(confirm('Wirklich löschen?')){await del('events',o.id);$('#modal').close();render()}})}
function mapv(d){$('#view').innerHTML=`<div id="map" class="map"></div><div class="mapNote">Online-Karte: OpenStreetMap. Deine Spots bleiben in Fishing OS gespeichert. Für die Navigation öffnet Fishing OS Apple Karten.</div><div class="mapActions"><button class="btn" id="mspot">＋ Spot</button><button class="btn secondary" id="mwater">＋ Gewässer</button></div><div class="section"><h2>Gespeicherte Spots</h2></div>${d.spots.map(s=>`<button class="row" data-spot="${s.id}"><div style="font-size:26px">📍</div><div class="grow"><h3>Spot ${s.number}${s.label?' · '+esc(s.label):''}</h3><div class="muted">${esc(d.waters.find(w=>w.id===s.waterId)?.name||'')}</div></div>›</button>`).join('')||'<div class="empty">Noch keine Spots.</div>'}`;$('#mspot').onclick=()=>spotForm(d,d.waters[0]?.id);$('#mwater').onclick=()=>waterForm(d);$$('[data-spot]').forEach(b=>b.onclick=()=>spotDetail(d.spots.find(s=>s.id===b.dataset.spot),d));setTimeout(()=>{if(!window.L){$('#map').innerHTML='<div class="empty">Karte konnte nicht geladen werden. Internet prüfen.</div>';return}let pts=[...d.waters.filter(x=>x.lat&&x.lon).map(x=>({x,k:'water'})),...d.spots.filter(x=>x.lat&&x.lon).map(x=>({x,k:'spot'}))],center=pts[0]?[+pts[0].x.lat,+pts[0].x.lon]:[28.12,-15.43];state.map=L.map('map').setView(center,pts.length?11:8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(state.map);pts.forEach(p=>{let label=p.k==='spot'?`Spot ${p.x.number}${p.x.label?' · '+p.x.label:''}`:p.x.name,nav=appleMaps(p.x.lat,p.x.lon,label);L.marker([+p.x.lat,+p.x.lon]).addTo(state.map).bindPopup(`<b>${esc(label)}</b><br><a target="_blank" href="${nav}">In Apple Karten navigieren</a>`)});if(pts.length){let group=L.featureGroup([...state.map._layers?[]:[]]);let b=pts.map(p=>[+p.x.lat,+p.x.lon]);if(b.length>1)state.map.fitBounds(b,{padding:[25,25]})}},80)}
function journal(d){let ds=[...d.days].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));$('#view').innerHTML=`<div class="section"><h2>Deine Angeltage</h2><button class="link" id="jnew">＋ Neu</button></div>${ds.map(x=>{let ev=d.events.filter(e=>e.dayId===x.id),w=d.waters.find(z=>z.id===x.waterId),c=ev.filter(e=>e.type==='catch').length;return `<button class="row" data-day="${x.id}"><div style="font-size:28px">📖</div><div class="grow"><h3>${date(x.startedAt)} · ${esc(w?.name||'')}</h3><div>${c} Fänge · ${ev.length} Ereignisse</div><div class="muted">${x.weather?`${x.weather.temp} °C · ${x.weather.pressure} hPa · ${x.weather.windText}`:'Kein Wetter-Snapshot'}</div></div>›</button>`}).join('')||'<div class="empty">Noch keine Angeltage.</div>'}`;$('#jnew').onclick=()=>dayForm(d);$$('[data-day]').forEach(b=>b.onclick=()=>dayDetail(d.days.find(x=>x.id===b.dataset.day),d))}
function dayDetail(day,d){let w=d.waters.find(x=>x.id===day.waterId),ev=d.events.filter(e=>e.dayId===day.id);show('Angeltag '+date(day.startedAt),`<div class="card"><h3>${esc(w?.name||'')}</h3><div class="muted">${time(day.startedAt)} – ${day.endedAt?time(day.endedAt):'läuft'}</div><p>${esc(day.notes||'')}</p></div>${weatherHTML(day.weather)}<div class="section"><h2>Ereignisse</h2></div>${ev.sort((a,b)=>new Date(a.at)-new Date(b.at)).map(e=>erow(e,d)).join('')||'<div class="empty">Nullfang-Session: kein Fang/Ereignis dokumentiert.</div>'}`);bindEvents(d)}
function band(v,size){if(v==null||v==='')return null;let n=+v,a=Math.floor(n/size)*size;return `${a}–${a+size-1}`}
function topEntry(obj){let a=Object.entries(obj).sort((a,b)=>b[1]-a[1]);return a[0]||['–',0]}
function stats(d){let catches=d.events.filter(e=>e.type==='catch'),sessions=d.days.filter(x=>x.endedAt),successful=sessions.filter(day=>d.events.some(e=>e.dayId===day.id&&e.type==='catch')).length,pressure={},temp={},wind={},lures={};catches.forEach(e=>{if(e.weather?.pressure){let k=band(e.weather.pressure,5);pressure[k]=(pressure[k]||0)+1}if(e.weather?.temp!=null){let k=band(e.weather.temp,5);temp[k]=(temp[k]||0)+1}if(e.weather?.windText)wind[e.weather.windText]=(wind[e.weather.windText]||0)+1;if(e.lure)lures[e.lure]=(lures[e.lure]||0)+1});let tp=topEntry(pressure),tt=topEntry(temp),tw=topEntry(wind),tl=topEntry(lures);$('#view').innerHTML=`<div class="statgrid"><div class="stat"><b>${d.days.length}</b><br>Angeltage</div><div class="stat"><b>${catches.length}</b><br>Fänge</div><div class="stat"><b>${sessions.length?Math.round(successful/sessions.length*100):0}%</b><br>Session-Erfolg</div><div class="stat"><b>${d.spots.length}</b><br>Spots</div></div><div class="section"><h2>Dein Wetter-Muster</h2></div><div class="card"><div class="statline"><span>🧭 Häufigster Luftdruck bei Fang</span><b>${tp[0]} hPa · ${tp[1]}×</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="statline"><span>🌡️ Häufigster Temperaturbereich</span><b>${tt[0]} °C · ${tt[1]}×</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="statline"><span>💨 Häufigste Windrichtung</span><b>${tw[0]} · ${tw[1]}×</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="statline"><span>🪱 Erfolgreichster Köder</span><b>${esc(tl[0])} · ${tl[1]}×</b></div></div><div class="notice">Wichtig: Fishing OS zählt Nullfang-Angeltage mit. Dadurch wird später nicht nur analysiert, wann du gefangen hast, sondern auch wann ähnliche Bedingungen erfolglos waren. Bei kleinen Datenmengen sind Muster noch Zufall – erst mit vielen Sessions werden sie belastbar.</div><div class="section"><h2>Fänge mit Wetter-Snapshot</h2></div>${catches.filter(e=>e.weather).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,20).map(e=>`<div class="row"><div class="grow"><b>${esc(e.species||'Fang')} · ${date(e.at)}</b><div class="muted">${e.weather.temp} °C · ${e.weather.pressure} hPa · ${e.weather.windText} ${e.weather.wind} km/h</div></div></div>`).join('')||'<div class="empty">Noch keine Wetterdaten an Fängen.</div>'}`}
function gallery(d){let p=[...d.waters.flatMap(w=>(w.photos||[]).map(x=>({x,l:w.name}))),...d.spots.flatMap(s=>(s.photos||[]).map(x=>({x,l:'Spot '+s.number}))),...d.events.flatMap(e=>(e.photos||[]).map(x=>({x,l:et(e.type)})))];show('Galerie',`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${p.map(a=>`<div><img src="${a.x}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px"><small>${esc(a.l)}</small></div>`).join('')||'<div class="empty">Noch keine Fotos.</div>'}</div>`)}
$('#add').onclick=async()=>{let d=await data();show('Schneller Eintrag',`<div class="quick" style="grid-template-columns:repeat(2,1fr)">${[['catch','🐟','Fang'],['bite','🪝','Biss'],['follow','🐠','Nachläufer'],['observe','🔭','Beobachtung']].map(x=>`<button class="card" data-qa="${x[0]}" style="font-size:20px">${x[1]}<br><b>${x[2]}</b></button>`).join('')}<button class="card" id="qspot">📍<br><b>Spot</b></button><button class="card" id="qwater">🌊<br><b>Gewässer</b></button><button class="card" id="qday">🗓️<br><b>Angeltag</b></button><button class="card" id="qlab">🧪<br><b>Labor</b></button></div>`);$$('[data-qa]').forEach(b=>b.onclick=()=>{$('#modal').close();eventForm(b.dataset.qa,d)});$('#qspot').onclick=()=>{$('#modal').close();spotForm(d,d.waters[0]?.id)};$('#qwater').onclick=()=>{$('#modal').close();waterList(d)};$('#qday').onclick=()=>{$('#modal').close();dayForm(d)};$('#qlab').onclick=()=>{$('#modal').close();labForm(d)}}
function labForm(d){show('Gewässer-Labor',`<form id="lf" class="form"><div class="field"><label>Typ</label><select name="kind"><option>Beobachtung</option><option>Hypothese</option><option>Experiment</option><option>Erkenntnis</option></select></div><div class="field"><label>Gewässer</label><select name="waterId"><option value="">– optional –</option>${d.waters.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div class="field"><label>Text</label><textarea name="text" required></textarea></div><button class="btn full">Speichern</button></form>`);$('#lf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await put('lab',{id:crypto.randomUUID(),kind:f.get('kind'),waterId:f.get('waterId'),text:f.get('text'),at:now()});$('#modal').close();render()}}
$('#backup').onclick=async()=>{show('Daten & Sicherung',`<div class="form"><button class="btn full" id="export">⇩ Sicherung exportieren</button><button class="btn secondary full" id="import">⇧ Sicherung importieren</button><p class="muted">Die App speichert deine Daten lokal. Online genutzt werden Karte und Wetterdienst.</p></div>`);$('#export').onclick=async()=>{let o={schema:'FishingOS',version:3,createdAt:now(),data:await data()},a=document.createElement('a'),blob=new Blob([JSON.stringify(o)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='FishingOS-v0.3-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};$('#import').onclick=()=>$('#importFile').click()};
$('#importFile').onchange=async e=>{try{let p=JSON.parse(await e.target.files[0].text());for(let s of STORES){let tx=db.transaction(s,'readwrite'),os=tx.objectStore(s);os.clear();(p.data?.[s]||[]).forEach(x=>os.put(x));await new Promise(r=>tx.oncomplete=r)}$('#modal').close();render();alert('Import abgeschlossen.')}catch{alert('Import fehlgeschlagen.')}};
openDB().then(render); if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
