<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Fishing OS" />
  <title>Fishing OS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="greeting">Guten Tag, Max</p>
        <h1 id="pageTitle">Übersicht</h1>
      </div>
      <button class="icon-button" id="exportButton" aria-label="Datensicherung exportieren">⇧</button>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav class="tabbar" aria-label="Hauptnavigation">
      <button class="tab active" data-view="home"><span>⌂</span><small>Home</small></button>
      <button class="tab" data-view="waters"><span>⌖</span><small>Gewässer</small></button>
      <button class="tab add-tab" data-view="newCatch"><span>＋</span><small>Fang</small></button>
      <button class="tab" data-view="stats"><span>▥</span><small>Statistik</small></button>
      <button class="tab" data-view="more"><span>☰</span><small>Mehr</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <input id="importInput" type="file" accept="application/json" hidden />

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
