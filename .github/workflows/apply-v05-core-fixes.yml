name: Apply v0.5 core fixes
on:
  push:
    paths:
      - 'tools/patch-v05-core.py'
      - '.github/workflows/apply-v05-core-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch isolated preview
        run: python tools/patch-v05-core.py
      - name: Commit patched preview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add preview-v05/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix v0.5 spot timeline and weather presentation"
          git push
