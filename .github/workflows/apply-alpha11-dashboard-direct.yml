name: Apply alpha11 dashboard direct
on:
  push:
    branches: [update/v0.5-workflow]
    paths: [scripts/apply_alpha11_dashboard_direct.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/v0.5-workflow
      - name: Apply direct dashboard navigation
        run: python3 scripts/apply_alpha11_dashboard_direct.py
      - name: Sanity checks
        run: |
          grep -q 'data-dashboard-nav="catches"' app-v05.html
          grep -q 'data-dashboard-nav="journal"' app-v05.html
          grep -q 'renderSpotOverviewAlpha11' app-v05.html
          grep -q 'fishing-os-v0.5.0-alpha11' service-worker.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v05.html service-worker.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Wire dashboard metrics directly into main app"
            git push origin update/v0.5-workflow
          fi
