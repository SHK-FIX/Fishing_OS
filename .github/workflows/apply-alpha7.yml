name: Apply v0.5 alpha7
on:
  push:
    branches: [main]
    paths:
      - 'preview-v05/hotfix-alpha7.js'
      - '.github/workflows/apply-alpha7.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire alpha7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('preview-v05/index.html')
          s=p.read_text()
          tag='<script src="./hotfix-alpha7.js?v=7"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)

          sw=Path('preview-v05/service-worker.js')
          t=sw.read_text()
          t=re.sub(r"const C='[^']+';", "const C='fishing-os-v0.5.0-alpha7';", t)
          if "'./hotfix-alpha7.js'" not in t:
              if "'./hotfix-alpha6.js'" in t:
                  t=t.replace("'./hotfix-alpha6.js'", "'./hotfix-alpha6.js','./hotfix-alpha7.js'")
              else:
                  t=t.replace("'./index.html'", "'./index.html','./hotfix-alpha7.js'")
          sw.write_text(t)
          PY
      - name: Commit generated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-v05/index.html preview-v05/service-worker.js
          git diff --cached --quiet || git commit -m "Apply alpha7 quick entry fix"
          git push
