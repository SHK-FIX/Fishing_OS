name: Apply alpha9 dashboard metrics
on:
  push:
    branches: [update/v0.5-workflow]
    paths: [scripts/apply_alpha9_dashboard_metrics.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/v0.5-workflow
      - name: Apply dashboard metric navigation
        run: python3 scripts/apply_alpha9_dashboard_metrics.py
      - name: Sanity checks
        run: |
          grep -q 'hotfix-alpha9.js?v=9' app-v05.html
          grep -q 'renderSpotOverviewAlpha9' hotfix-alpha9.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v05.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Enable dashboard metric navigation"
            git push origin update/v0.5-workflow
          fi
