name: Apply v0.5 pretest polish
on:
  push:
    branches: [update/v0.5-workflow]
    paths:
      - scripts/apply_v05_polish.py
      - .github/workflows/apply-v05-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/v0.5-workflow
      - name: Apply guarded polish
        run: python3 scripts/apply_v05_polish.py
      - name: Sanity checks
        run: |
          grep -q "locateMe(false)" index.html
          grep -q "Köderverlust" index.html
          grep -q "FishingOS-v0.5-Backup" index.html
      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish location UX and pretest actions"
            git push origin update/v0.5-workflow
          fi
