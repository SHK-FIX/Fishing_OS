name: Apply v0.5 integrity fixes
on:
  push:
    branches: [update/v0.5-workflow]
    paths: [scripts/apply_v05_integrity.py]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/v0.5-workflow
      - name: Apply guarded integrity patch
        run: python3 scripts/apply_v05_integrity.py
      - name: Sanity checks
        run: |
          grep -q "0.5.0-dev3" index.html
          grep -q "historische Einträge" index.html
          grep -q "Der ausgewählte Spot gehört nicht" index.html
          grep -q "kann deshalb nicht gelöscht werden" index.html
      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Harden v0.5 data integrity before release"
            git push origin update/v0.5-workflow
          fi
